<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Folder Orbit</title>
  <style>
    @font-face {
      font-family: 'Ferrite';
      src: url('/static/FERRITEDISPLAYVF.ttf') format('truetype');
      font-weight: 100 900;
    }
    html, body { margin:0; padding:0; width:100%; height:100%; background:transparent; overflow:hidden; cursor:default; }
    /* Top bar removed */
    /* Glass overlay */
    .glass { position:fixed; top:0; left:0; width:100vw; height:100vh; backdrop-filter:blur(14px) brightness(1.1); background:rgba(12,28,90,0.08); opacity:0; transition:opacity 0.6s ease; pointer-events:none; z-index:1; }
    .glass.visible { opacity:1; }
    /* Canvas layers */
    #bgCanvas, #fgCanvas { position:absolute; top:0; left:0; width:100%; height:100%; }
    #bgCanvas { z-index:0; }
    /* raise front canvas well above overlay */
    #fgCanvas { z-index:5; pointer-events:none; }
    /* Labels */
    #labels { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:6; font-family:'Ferrite',sans-serif; opacity:1; transition:opacity 0.5s; }
    #labels.hidden { opacity:0; }
    .label { position:absolute; transform:translate(-50%,0); color:#1449ff; font-size:14px; text-shadow:0 0 4px #fff; font-variation-settings:'wght' 700; }
    #sceneWrap { position:fixed; inset:0; }
    #sceneWrap.masked {
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 15%, #000 100%);
              mask-image: linear-gradient(to bottom, transparent 0%, #000 15%, #000 100%);
    }
    @keyframes breathe {
      from { opacity:0.4; }
      to   { opacity:0.8; }
    }
    /* Folder UI overlay */
    #folderUi {
      position:fixed;
      left:50%;
      top:50%;
      display:flex;
      align-items:flex-end;
      gap:clamp(12px, 3vw, 48px);
      pointer-events:none;
      opacity:0;
      transform:translate(-60%, -90%);
      transition:opacity 0.3s ease;
      z-index:7;
      color:#1449ff;
      font-family:'Ferrite', sans-serif;
    }
    #folderUi.visible {
      opacity:1;
      pointer-events:auto;
    }
    #folderBackButton {
      width:clamp(52px, 6vw, 72px);
      height:clamp(52px, 6vw, 72px);
      border:4px solid #1449ff;
      background:rgba(250,248,229,0.92);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:#1449ff;
      transition:transform 0.3s ease;
    }
    #folderBackButton:hover {
      transform:translateX(-6px);
    }
    #folderBackButton svg { width:60%; height:60%; }
    #folderTitle.interactive-text {
      font-size:clamp(32px, 6vw, 96px);
      white-space:nowrap;
      display:flex;
      align-items:flex-end;
      gap:0;
    }
    #folderTitle .letter {
      display:inline-block;
      overflow:hidden;
      transition:width 0.25s cubic-bezier(.25,.1,.25,1);
    }
    #folderTitle .letter .char {
      display:inline-block;
      transform-origin:left center;
      transition:transform 0.25s cubic-bezier(.25,.1,.25,1), font-variation-settings 0.25s cubic-bezier(.25,.1,.25,1);
      font-variation-settings:'wght' 400;
    }
  </style>
</head>
<body>
  <!-- top bar removed -->
  <div id="sceneWrap" class="masked">
    <div class="glass" id="glass"></div>

    <canvas id="bgCanvas"></canvas>
    <canvas id="fgCanvas"></canvas>

    <div id="folderUi">
      <button id="folderBackButton" aria-label="Close folder">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M14 6 8 12l6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
          <path d="M20 12H8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
      </button>
      <div id="folderTitle" class="interactive-text"></div>
    </div>

    <div id="labels"></div>
  </div>
  <!-- removed original overlay here -->

  <script src="https://unpkg.com/three@0.148.0/build/three.min.js"></script>
  <script>
    let FOLDER_NAMES = [];
  </script>
  <script>
    // Renderer & scene setup
    const sceneWrap = document.getElementById('sceneWrap');
    const bgCanvas = document.getElementById('bgCanvas'),
          fgCanvas = document.getElementById('fgCanvas'),
          glass = document.getElementById('glass');
    // logo removed

    /* top bar scripts removed */
    const bgRenderer = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias:true, alpha:true });
    bgRenderer.setClearColor(0x000000, 0);
    const fgRenderer = new THREE.WebGLRenderer({ canvas: fgCanvas, antialias:true, alpha:true });
    fgRenderer.setClearColor(0,0);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 16;

    window.addEventListener('resize', ()=>{
      bgRenderer.setSize(window.innerWidth, window.innerHeight);
      fgRenderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      render();
    });
    bgRenderer.setSize(window.innerWidth, window.innerHeight);
    fgRenderer.setSize(window.innerWidth, window.innerHeight);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.1);
    dirLight.position.set(0,0,4);
    scene.add(dirLight);

    // Raycaster & cursor
    const raycaster = new THREE.Raycaster(),
          mouse = new THREE.Vector2(),
          cursor3D = new THREE.Vector3(),
          tempVec = new THREE.Vector3();
    let targetMouse = {x:0,y:0}, currentMouse = {x:0,y:0}, magnetized = null;
    window.addEventListener('mousemove', e => {
      const nx = (e.clientX/window.innerWidth - 0.5)*2;
      const ny = -(e.clientY/window.innerHeight - 0.5)*2;
      targetMouse.x = nx; targetMouse.y = ny;
      mouse.x = (e.clientX/window.innerWidth)*2 - 1;
      mouse.y = -(e.clientY/window.innerHeight)*2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const d = -raycaster.ray.origin.z / raycaster.ray.direction.z;
      cursor3D.copy(raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(d)));
    });

    const ease = t => t < 0.5 ? 2*t*t : (-1+(4-2*t)*t);

    // Folder factory
    function createFolder(name) {
      const g = new THREE.Group();
      const frontMat = new THREE.MeshStandardMaterial({ color:0x89d8fd, roughness:0.4, metalness:0.2 });
      const backMat  = new THREE.MeshStandardMaterial({ color:0x5bbde9, roughness:0.45, metalness:0.15 });
      const w=2.5, h=1.8, r=0.15;
      const shape = new THREE.Shape();
      shape.moveTo(-w/2+r,-h/2).lineTo(w/2-r,-h/2).quadraticCurveTo(w/2,-h/2,w/2,-h/2+r)
           .lineTo(w/2,h/2-r).quadraticCurveTo(w/2,h/2,w/2-r,h/2)
           .lineTo(-w/2+r,h/2).quadraticCurveTo(-w/2,h/2,-w/2,h/2-r)
           .lineTo(-w/2,-h/2+r).quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
      const geom = new THREE.ExtrudeGeometry(shape, { depth:0.03, bevelEnabled:true, bevelThickness:0.025, bevelSize:0.025, bevelSegments:2 });
      const front = new THREE.Mesh(geom, frontMat);
      front.geometry.translate(0,0.9,0);
      front.position.z=0.015;
      front.castShadow=true;
      g.add(front);
      const back = new THREE.Mesh(geom.clone(), backMat);
      back.scale.y=1.07;
      back.position.set(0,0.05,-0.015);
      back.receiveShadow=true;
      g.add(back);
      g.scale.set(0.9,0.9,0.9);

      const lipShape = new THREE.Shape();
      lipShape.moveTo(-1.25,0).quadraticCurveTo(-1.25,0.2,-1.1,0.2).lineTo(-0.6,0.2)
              .quadraticCurveTo(-0.45,0.2,-0.3,0).lineTo(-0.3,-0.3)
              .quadraticCurveTo(-0.32,-0.43,-0.6,-0.43).lineTo(-1.22,-0.42)
              .quadraticCurveTo(-1.28,-0.38,-1.24,-0.3).lineTo(-1.25,0);
      const lip = new THREE.Mesh(new THREE.ExtrudeGeometry(lipShape, { depth:0.03, bevelEnabled:true, bevelThickness:0.025, bevelSize:0.025, bevelSegments:2 }), backMat);
      lip.position.set(0,1.9,-0.015);
      lip.receiveShadow=true;
      g.add(lip);

      const anchor = new THREE.Object3D();
      anchor.position.set(-1.2, 2.05, 0.08);
      g.add(anchor);

      const dir = new THREE.Vector3((Math.random()-0.5)*2,(Math.random()-0.5)*2,0).normalize();
      g.userData = {
        name, front, dir,
        speed:0.002 + Math.random()*0.001,
        curvePhase:Math.random()*Math.PI*2,
        curveScale:0.005 + Math.random()*0.003,
        focused:false, clickStart:0, startPos:new THREE.Vector3(), targetPos:new THREE.Vector3(), duration:1000,
        innerR:1.2, hoverPhase:0,
        returning:false, returnStart:0, returnFrom:new THREE.Vector3(), returnTo:new THREE.Vector3(), returnDuration:1000,
        spin:false, spinElapsed:0, spinDuration:1,
        magnetStart:0,
        startScale:new THREE.Vector3(),
        targetScale:new THREE.Vector3(),
        scaleReturnFrom:new THREE.Vector3(),
        scaleReturnTo:new THREE.Vector3(),
        openDuration:1000, uiShown:false,
        startRotation:new THREE.Euler(),
        targetRotation:new THREE.Euler(),
        rotationReturnFrom:new THREE.Euler(),
        rotationReturnTo:new THREE.Euler(),
        frontBaseRotation: front.rotation.x,
        frontBasePosition: front.position.clone(),
        frontReturnFrom:front.rotation.x,
        frontReturnTo:front.rotation.x,
        uiAnchor: anchor
      };
      return g;
    }

    const folders = [], labels = [];
    const labelsContainer = document.getElementById('labels');

    function initFolders(names) {
      FOLDER_NAMES = names || FOLDER_NAMES;
      hideFolderUi();
      folders.forEach(f => scene.remove(f));
      folders.length = 0;
      labelsContainer.innerHTML = '';
      labels.length = 0;
      FOLDER_NAMES.forEach(name => {
        const f = createFolder(name);
        scene.add(f);
        folders.push(f);
        const lbl = document.createElement('div');
        lbl.className = 'label';
        lbl.textContent = name.toUpperCase();
        labelsContainer.appendChild(lbl);
        labels.push(lbl);
      });
      startTime = performance.now();
    }

    // intro animation timings
    const introDur=3000, scatterDur=2000;
    let startTime = performance.now();

    // folder UI overlay
    const folderUi = document.getElementById('folderUi');
    const folderBackButton = document.getElementById('folderBackButton');
    const folderTitle = document.getElementById('folderTitle');
    let uiFolder = null;
    function showFolderUi(folder){
      uiFolder = folder;
      folderUi.classList.add('visible');
      labelsContainer.classList.add('hidden');
      setupInteractiveText(folder.userData.name.toUpperCase());
      sceneWrap.classList.remove('masked');
      parent.postMessage({ topoColor: '#1449ff', fade: true, gridOpen: true }, '*');
    }
    function hideFolderUi(){
      if(!uiFolder) return;
      folderUi.classList.remove('visible');
      labelsContainer.classList.remove('hidden');
      if(folderTitle) folderTitle.textContent = '';
      uiFolder = null;
      sceneWrap.classList.add('masked');
      parent.postMessage({ topoColor: '#ffffff', fade: true, gridOpen: false }, '*');
    }
    folderBackButton.addEventListener('click', e => {
      e.stopPropagation();
      closeActive();
    });

    function setupInteractiveText(text){
      const C = folderTitle;
      if(!C) return;
      const hoverScale=1.8, neighborScale=1.2,
            normalWght=400, neighborWght=600, hoverWght=900;
      C.textContent = '';
      for(const ch of (text||'').trim()){
        const out=document.createElement('span');
        out.className='letter';
        const inn=document.createElement('span');
        inn.className='char';
        inn.textContent=ch;
        out.appendChild(inn);
        C.appendChild(out);
      }

      const letters=Array.from(C.children);
      let baseWidths=[], scaled=[], sumBase=0, totalW=0;
      requestAnimationFrame(()=>{
        letters.forEach(o=>{
          const inn=o.firstElementChild;
          inn.style.transform='scaleX(1)';
          const w=inn.getBoundingClientRect().width;
          baseWidths.push(w);
          sumBase+=w;
        });
        totalW=C.getBoundingClientRect().width;
        const S=totalW/sumBase;
        scaled=baseWidths.map(w=>w*S);
        letters.forEach((o,i)=>{
          const inn=o.firstElementChild;
          o.style.width=scaled[i]+'px';
          inn.style.width=baseWidths[i]+'px';
          inn.style.transform=`scaleX(${S})`;
          inn.style.fontVariationSettings=`'wght' ${normalWght}`;
        });
        letters.forEach((o,i)=>{
          o.onmouseenter=()=>{
            const wH=scaled[i];
            const wN=(i>0?scaled[i-1]:0)+(i<letters.length-1?scaled[i+1]:0);
            const wO=totalW-wH-wN;
            const R_h=hoverScale, R_n=neighborScale;
            const R_o=(totalW-wH*R_h-wN*R_n)/wO;
            letters.forEach((oo,j)=>{
              const ch=oo.firstElementChild;
              let R,wght;
              if(j===i){R=R_h; wght=hoverWght;}
              else if(j===i-1||j===i+1){R=R_n; wght=neighborWght;}
              else {R=R_o; wght=normalWght;}
              oo.style.width=scaled[j]*R+'px';
              ch.style.transform=`scaleX(${S*R})`;
              ch.style.fontVariationSettings=`'wght' ${wght}`;
            });
          };
          o.onmouseleave=()=>{
            letters.forEach((oo,j)=>{
              const ch=oo.firstElementChild;
              oo.style.width=scaled[j]+'px';
              ch.style.transform=`scaleX(${S})`;
              ch.style.fontVariationSettings=`'wght' ${normalWght}`;
            });
          };
        });
      });
    }

    function closeActive(){
      const f = folders.find(o=>o.userData.focused);
      if(!f) return;
      const ud = f.userData;
      ud.returning = true;
      ud.returnStart = performance.now();
      ud.returnFrom.copy(f.position);
      ud.returnTo.copy(ud.startPos);
      ud.scaleReturnFrom.copy(f.scale);
      ud.scaleReturnTo.copy(ud.startScale);
      ud.rotationReturnFrom.copy(f.rotation);
      ud.rotationReturnTo.copy(ud.startRotation);
      ud.frontReturnFrom = ud.front.rotation.x;
      ud.uiShown = false;
      glass.classList.remove('visible');
      hideFolderUi();
    }

    // click behavior
    window.addEventListener('click', ()=>{
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(folders.map(f=>f.userData.front));
      if(!hits.length) return;
      const f = hits[0].object.parent, ud = f.userData;
      const active = folders.find(o=>o.userData.focused);
      if(active && active!==f) return; // disable other folders while grid shown
      if(!ud.focused) {
        folders.forEach(o=>o.userData.focused=false); // only one active
        ud.focused = true;
        ud.clickStart = performance.now();
        ud.startPos.copy(f.position);
        ud.startScale.copy(f.scale);
        ud.startRotation.copy(f.rotation);
        ud.rotationReturnTo.copy(ud.startRotation);
        ud.targetPos.set(0,0.35,4.8);
        ud.targetScale.set(5.2,5.2,5.2);
        ud.targetRotation.set(0,0,0);
        ud.uiShown = false;
        ud.frontReturnTo = ud.frontBaseRotation;
        glass.classList.add('visible');
      } else {
        ud.returning = true;
        ud.returnStart = performance.now();
        ud.returnFrom.copy(f.position);
        ud.returnTo.copy(ud.startPos);
        ud.scaleReturnFrom.copy(f.scale);
        ud.scaleReturnTo.copy(ud.startScale);
        ud.rotationReturnFrom.copy(f.rotation);
        ud.rotationReturnTo.copy(ud.startRotation);
        ud.frontReturnFrom = ud.front.rotation.x;
        ud.frontReturnTo = ud.frontBaseRotation;
        ud.uiShown = false;
        glass.classList.remove('visible');
        hideFolderUi();
      }
    });

    // animation loop
    function animate(){
      requestAnimationFrame(animate);
      const now = performance.now(), dt = now - startTime;
      const activeFolder = folders.find(f=>f.userData.focused);
      if(activeFolder){
        targetMouse.x = 0;
        targetMouse.y = 0;
      }
      // intro
      if(dt < introDur) {
        const a = (dt/introDur)*Math.PI*2;
        folders.forEach((f,i)=>{
          const th = (i/folders.length)*Math.PI*2 + a;
          f.position.set(Math.cos(th)*5, Math.sin(th)*5, 0);
        });
      }
      // scatter
      else if(dt < introDur+scatterDur) {
        const p = (dt-introDur)/scatterDur;
        folders.forEach((f,i)=>{
          const ti = Math.max(Math.min(p*folders.length-i,1),0), ei = ease(ti);
          const th = (i/folders.length)*Math.PI*2;
          const ctr = new THREE.Vector3(Math.cos(th)*5, Math.sin(th)*5, 0);
          f.position.copy(ctr.add(f.userData.dir.clone().multiplyScalar(ei*3)));
        });
      }
      // main
      else {
        raycaster.setFromCamera(mouse, camera);
        const hoverHits = raycaster.intersectObjects(folders.map(f=>f.userData.front));
        folders.forEach(f=>{ f.userData.hovered = hoverHits.some(h=>h.object===f.userData.front); });
        const accel = Math.hypot(targetMouse.x-currentMouse.x, targetMouse.y-currentMouse.y);
        if(magnetized && accel>2) magnetized = null;
        folders.forEach((f,idx)=>{
          const ud = f.userData;
          const to = cursor3D.clone().sub(f.position);
          const d = to.length();
          if(magnetized===f && now-ud.magnetStart>2000) magnetized=null;
          if(d<ud.innerR && accel>3 && !ud.spin) { ud.spin=true; ud.spinElapsed=0; }
          if(ud.spin) {
            ud.spinElapsed+=0.1;
            f.rotation.y = (ud.spinElapsed/ud.spinDuration)*Math.PI*2;
            if(ud.spinElapsed>=ud.spinDuration) { ud.spin=false; f.rotation.y=0; }
            return;
          }
          if((magnetized===null || magnetized===f) && d<ud.innerR && !ud.focused) {
            magnetized = f;
            ud.magnetStart = now;
            const repel = new THREE.Vector3();
            folders.forEach(o=>{ if(o!==f){ const dv=f.position.clone().sub(o.position); const distSq=dv.lengthSq(); if(distSq<16) repel.add(dv.normalize().multiplyScalar(0.05)); }});
            f.position.add(repel);
            const offset=new THREE.Vector3(0,-0.9,0);
            f.position.lerp(cursor3D.clone().add(offset), 0.05);
            ud.hoverPhase += 0.1;
            ud.front.rotation.x += (THREE.MathUtils.degToRad(15) - ud.front.rotation.x)*0.1;
            const breeze = accel * 0.3;
            f.rotation.y += (Math.sin(ud.hoverPhase)*breeze - f.rotation.y)*0.2;
            f.rotation.z += (Math.cos(ud.hoverPhase)*breeze*0.5 - f.rotation.z)*0.2;
            return;
          }
          if(ud.returning){
            const t = Math.min((now-ud.returnStart)/ud.returnDuration,1);
            const eased = ease(t);
            f.position.lerpVectors(ud.returnFrom, ud.returnTo, eased);
            f.scale.lerpVectors(ud.scaleReturnFrom, ud.scaleReturnTo, eased);
            f.rotation.set(
              THREE.MathUtils.lerp(ud.rotationReturnFrom.x, ud.rotationReturnTo.x, eased),
              THREE.MathUtils.lerp(ud.rotationReturnFrom.y, ud.rotationReturnTo.y, eased),
              THREE.MathUtils.lerp(ud.rotationReturnFrom.z, ud.rotationReturnTo.z, eased)
            );
            ud.front.rotation.x += (ud.frontReturnTo - ud.front.rotation.x)*0.2;
            ud.front.position.y += (ud.frontBasePosition.y - ud.front.position.y)*0.2;
            ud.front.position.z += (ud.frontBasePosition.z - ud.front.position.z)*0.2;
            if(t>=1){
              ud.returning=false;
              ud.focused=false;
              f.rotation.copy(ud.rotationReturnTo);
              ud.front.rotation.x = ud.frontBaseRotation;
              ud.front.position.copy(ud.frontBasePosition);
            }
            return;
          }
          if(ud.focused){
            const elapsed = now - ud.clickStart;
            const moveT = Math.min(elapsed/ud.duration,1);
            const openT = Math.min(elapsed/ud.openDuration,1);
            const moveEase = ease(moveT);
            const openEase = ease(openT);
            f.position.lerpVectors(ud.startPos, ud.targetPos, moveEase);
            f.scale.lerpVectors(ud.startScale, ud.targetScale, moveEase);
            f.rotation.set(
              THREE.MathUtils.lerp(ud.startRotation.x, ud.targetRotation.x, moveEase),
              THREE.MathUtils.lerp(ud.startRotation.y, ud.targetRotation.y, moveEase),
              THREE.MathUtils.lerp(ud.startRotation.z, ud.targetRotation.z, moveEase)
            );
            if(moveT>=1){
              const bob = Math.sin(now/900)*0.08;
              f.position.y = ud.targetPos.y + bob;
            }
            const flatZ = THREE.MathUtils.lerp(ud.targetScale.z, ud.targetScale.z*0.12, openEase);
            f.scale.z += (flatZ - f.scale.z)*0.18;
            const lidRot = THREE.MathUtils.lerp(ud.frontBaseRotation, -Math.PI*0.98, openEase);
            ud.front.rotation.x += (lidRot - ud.front.rotation.x)*0.25;
            ud.front.position.y += (ud.frontBasePosition.y - ud.front.position.y)*0.25;
            const lidOffsetZ = THREE.MathUtils.lerp(ud.frontBasePosition.z, ud.frontBasePosition.z - 0.09, openEase);
            ud.front.position.z += (lidOffsetZ - ud.front.position.z)*0.25;
            if(openEase>0.85 && !ud.uiShown){
              ud.uiShown = true;
              showFolderUi(f);
            }
            return;
          }
          if(magnetized===f && d>=ud.innerR) magnetized=null;
          f.rotation.y += (0 - f.rotation.y)*0.2;
          f.rotation.z += (0 - f.rotation.z)*0.2;
          if(hoverHits.find(h=>h.object===ud.front)) ud.front.rotation.x += (THREE.MathUtils.degToRad(15) - ud.front.rotation.x)*0.1;
          else ud.front.rotation.x += (0 - ud.front.rotation.x)*0.1;
          ud.curvePhase += 0.01;
          const repel2 = new THREE.Vector3();
          folders.forEach(o=>{ if(o!==f){ const dv=f.position.clone().sub(o.position); const sq=dv.lengthSq(); if(sq<100) repel2.add(dv.normalize().multiplyScalar(0.08/sq)); }});
          const curveVec = new THREE.Vector3(
            Math.sin(ud.curvePhase),
            Math.sin(ud.curvePhase*0.9),
            Math.cos(ud.curvePhase*0.8)
          ).multiplyScalar(ud.curveScale);
          const cf = new THREE.Vector3();
          const magR = 5;
          if(d<magR && d>ud.innerR) cf.add(to.normalize().multiplyScalar((magR-d)/magR*0.02));
          f.position.add(
            ud.dir.clone().multiplyScalar(ud.speed)
              .add(curveVec)
              .add(repel2)
              .add(cf)
          );
          ['x','y'].forEach(a=>{ if(f.position[a]>5||f.position[a]<-5) ud.dir[a]*=-1; });
          f.position.z = Math.max(-0.4, Math.min(0.4, f.position.z));
        });
      }
      dirLight.position.x += (targetMouse.x*10 - dirLight.position.x)*0.1;
      dirLight.position.y += (targetMouse.y*10 - dirLight.position.y)*0.1;
      const a2 = Math.hypot(targetMouse.x-currentMouse.x, targetMouse.y-currentMouse.y);
      currentMouse.x += (targetMouse.x-currentMouse.x)*0.02*a2;
      currentMouse.y += (targetMouse.y-currentMouse.y)*0.02*a2;
      camera.position.set(currentMouse.x*3,currentMouse.y*3,16);
      camera.lookAt(0,0,0);

      // render background (all folders)
      bgRenderer.render(scene,camera);

      // render only focused folder in front
      const active = folders.find(f=>f.userData.focused);
      folders.forEach(f=> f.visible = !active || f===active );
      fgRenderer.render(scene,camera);
      folders.forEach(f=> f.visible = true );

      if(uiFolder){
        if(uiFolder.userData.focused){
          const anchorPos = uiFolder.userData.uiAnchor.getWorldPosition(tempVec);
          anchorPos.project(camera);
          const px = (anchorPos.x * 0.5 + 0.5) * window.innerWidth;
          const py = (-anchorPos.y * 0.5 + 0.5) * window.innerHeight;
          folderUi.style.left = `${px}px`;
          folderUi.style.top = `${py}px`;
        } else {
          hideFolderUi();
        }
      }

      // update labels
      labels.forEach((lbl,i)=>{
        const f = folders[i];
        const v = f.position.clone().project(camera);
        const x = (v.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
        lbl.style.left = `${x}px`;
        lbl.style.top  = `${y + 10}px`;
      });
    }
    animate();

    window.addEventListener('message', e => {
      if (e.data && Array.isArray(e.data.folders)) {
        initFolders(e.data.folders);
      }
      if (e.data && e.data.closeGrid) {
        closeActive();
      }
    });

    // request folder list from parent on load
    parent.postMessage({ requestFolders: true }, '*');
  </script>
</body>
</html>
