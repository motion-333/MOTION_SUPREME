<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Folder Orbit</title>
  <style>
    @font-face {
      font-family: 'Ferrite';
      src: url('/static/FERRITEDISPLAYVF.ttf') format('truetype');
      font-weight: 100 900;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      cursor: default;
    }
    #sceneWrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #bgCanvas {
      z-index: 1;
    }
    #networkCanvas {
      z-index: 2;
      pointer-events: none;
    }
    #labels {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      font-family: 'Ferrite', sans-serif;
      color: #1449ff;
    }
    .label {
      position: absolute;
      transform: translate(-50%, 0) scale(1);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
      transition: opacity 0.4s ease;
      opacity: 0.9;
      white-space: nowrap;
    }
    .label.selected {
      opacity: 1;
      letter-spacing: 0.22em;
    }
    .label.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="sceneWrap">
    <canvas id="bgCanvas"></canvas>
    <canvas id="networkCanvas"></canvas>
    <div id="labels"></div>
  </div>

  <script src="https://unpkg.com/three@0.148.0/build/three.min.js"></script>
  <script>
    const FOLDER_NAMES = ['Ads', 'Music Videos', 'Zines', 'Events', 'Graphics'];

    const sceneWrap = document.getElementById('sceneWrap');
    const bgCanvas = document.getElementById('bgCanvas');
    const networkCanvas = document.getElementById('networkCanvas');
    const labelsContainer = document.getElementById('labels');

    const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2.2, 18);

    const ambient = new THREE.AmbientLight(0xffffff, 0.88);
    scene.add(ambient);
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.36);
    keyLight.position.set(3.5, 5.8, 8);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x8ecbff, 0.28);
    rimLight.position.set(-6, 3.5, -6);
    scene.add(rimLight);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const folders = [];
    const labels = [];

    const topY = 3.3;
    const spacing = 3.1;
    const selectedScale = 1.45;
    const baseScale = 0.9;

    let aligned = false;
    let alignmentGoal = 0;
    let selectedIndex = -1;
    let targetSelection = 0;
    let currentSelection = 0;
    let selectionVelocity = 0;

    const networkCtx = networkCanvas.getContext('2d');
    let networkPoints = [];
    let networkEdges = [];

    const clock = new THREE.Clock();

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function createFolder(name, index) {
      const group = new THREE.Group();

      const frontMat = new THREE.MeshStandardMaterial({ color: 0x89d8fd, roughness: 0.4, metalness: 0.2 });
      const backMat = new THREE.MeshStandardMaterial({ color: 0x5bbde9, roughness: 0.45, metalness: 0.15 });

      const w = 2.5, h = 1.8, r = 0.15;
      const bodyShape = new THREE.Shape();
      bodyShape.moveTo(-w / 2 + r, -h / 2);
      bodyShape.lineTo(w / 2 - r, -h / 2);
      bodyShape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
      bodyShape.lineTo(w / 2, h / 2 - r);
      bodyShape.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
      bodyShape.lineTo(-w / 2 + r, h / 2);
      bodyShape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
      bodyShape.lineTo(-w / 2, -h / 2 + r);
      bodyShape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);

      const geom = new THREE.ExtrudeGeometry(bodyShape, {
        depth: 0.03,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2,
      });

      const front = new THREE.Mesh(geom, frontMat);
      front.geometry.translate(0, 0.9, 0);
      front.position.z = 0.015;
      front.castShadow = true;
      group.add(front);

      const back = new THREE.Mesh(geom.clone(), backMat);
      back.scale.y = 1.07;
      back.position.set(0, 0.05, -0.015);
      back.receiveShadow = true;
      group.add(back);

      const lipShape = new THREE.Shape();
      lipShape.moveTo(-1.25, 0)
        .quadraticCurveTo(-1.25, 0.2, -1.1, 0.2)
        .lineTo(-0.6, 0.2)
        .quadraticCurveTo(-0.45, 0.2, -0.3, 0)
        .lineTo(-0.3, -0.3)
        .quadraticCurveTo(-0.32, -0.43, -0.6, -0.43)
        .lineTo(-1.22, -0.42)
        .quadraticCurveTo(-1.28, -0.38, -1.24, -0.3)
        .lineTo(-1.25, 0);

      const lip = new THREE.Mesh(new THREE.ExtrudeGeometry(lipShape, {
        depth: 0.03,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2,
      }), backMat);
      lip.position.set(0, 1.9, -0.015);
      lip.receiveShadow = true;
      group.add(lip);

      group.scale.setScalar(baseScale);

      const orbitRadius = 6 + Math.random() * 3;
      const orbitSpeed = 0.16 + Math.random() * 0.05;
      const orbitAngle = (index / FOLDER_NAMES.length) * Math.PI * 2;

      group.userData = {
        name,
        orbit: {
          radius: orbitRadius,
          speed: orbitSpeed,
          angle: orbitAngle,
          vertical: 1.2 + Math.random() * 0.8,
          bobPhase: Math.random() * Math.PI * 2,
          swayPhase: Math.random() * Math.PI * 2,
          position: new THREE.Vector3(),
        },
        alignAlpha: 0,
        alignFrom: 0,
        alignDelay: 0,
        alignClock: 0,
        alignDuration: 0.8,
      };

      return group;
    }

    function initFolders() {
      FOLDER_NAMES.forEach((name, index) => {
        const folder = createFolder(name, index);
        scene.add(folder);
        folders.push(folder);

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = name.toUpperCase();
        labelsContainer.appendChild(label);
        labels.push(label);
      });
    }

    function regenerateNetwork() {
      networkCanvas.width = window.innerWidth;
      networkCanvas.height = window.innerHeight;
      networkPoints = [];
      networkEdges = [];
      const width = window.innerWidth;
      const height = window.innerHeight;
      const topLimit = height * 0.38;
      const bottomLimit = height * 0.92;
      for (let i = 0; i < 17; i++) {
        const baseX = width * 0.12 + Math.random() * width * 0.76;
        const baseY = topLimit + Math.random() * (bottomLimit - topLimit);
        networkPoints.push({
          baseX,
          baseY,
          x: baseX,
          y: baseY,
          angle: Math.random() * Math.PI * 2,
          amplitude: 12 + Math.random() * 20,
          speed: 0.25 + Math.random() * 0.35,
        });
      }
      for (let i = 0; i < networkPoints.length; i++) {
        for (let j = i + 1; j < networkPoints.length; j++) {
          networkEdges.push({ a: i, b: j });
        }
      }
    }

    function drawNetwork(delta, strength) {
      networkCtx.clearRect(0, 0, networkCanvas.width, networkCanvas.height);
      if (strength < 0.2) return;
      networkCtx.lineWidth = 0.8 + strength * 0.8;
      networkCtx.strokeStyle = `rgba(20, 73, 255, ${0.28 + strength * 0.32})`;
      networkCtx.fillStyle = '#1449ff';
      networkPoints.forEach(point => {
        point.angle += point.speed * delta;
        point.x = point.baseX + Math.cos(point.angle) * point.amplitude;
        point.y = point.baseY + Math.sin(point.angle * 0.85) * point.amplitude * 0.55;
      });
      networkCtx.beginPath();
      networkEdges.forEach(edge => {
        const a = networkPoints[edge.a];
        const b = networkPoints[edge.b];
        networkCtx.moveTo(a.x, a.y);
        networkCtx.lineTo(b.x, b.y);
      });
      networkCtx.stroke();
      const radius = 2.2 + strength * 1.4;
      networkPoints.forEach(point => {
        networkCtx.beginPath();
        networkCtx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        networkCtx.fill();
      });
    }

    function scheduleAlignment(index, aligning, immediate = false) {
      alignmentGoal = aligning ? 1 : 0;
      const baseDelay = aligning ? 0.16 : 0.12;
      folders.forEach((folder, i) => {
        const data = folder.userData;
        const falloff = index >= 0 ? Math.abs(i - index) : Math.abs(i - Math.floor(folders.length / 2));
        data.alignFrom = immediate ? alignmentGoal : data.alignAlpha;
        data.alignDelay = immediate ? 0 : falloff * baseDelay;
        data.alignClock = 0;
        data.alignDuration = aligning ? 0.85 : 0.8 + falloff * 0.05;
        if (immediate) {
          data.alignAlpha = alignmentGoal;
        }
      });
      if (aligning) {
        regenerateNetwork();
      }
    }

    function enterAligned(index, immediate = false) {
      aligned = true;
      selectedIndex = index;
      targetSelection = index;
      currentSelection = index;
      selectionVelocity = 0;
      scheduleAlignment(index, true, immediate);
      updateLabelSelection();
    }

    function exitAligned() {
      aligned = false;
      scheduleAlignment(selectedIndex, false);
      selectedIndex = -1;
      targetSelection = 0;
      updateLabelSelection();
    }

    function setSelected(index) {
      if (!aligned) {
        enterAligned(index);
        return;
      }
      if (selectedIndex === index) {
        exitAligned();
        return;
      }
      selectedIndex = index;
      targetSelection = index;
      selectionVelocity = 0;
      updateLabelSelection();
    }

    function updateLabelSelection() {
      labels.forEach((label, i) => {
        label.classList.toggle('selected', aligned && i === selectedIndex);
      });
    }

    const edgeThreshold = 90;
    const hoverDelay = 800;
    let edgeDir = 0;
    let edgeTimer = 0;

    window.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      if (aligned && event.clientX < edgeThreshold) edgeDir = -1;
      else if (aligned && window.innerWidth - event.clientX < edgeThreshold) edgeDir = 1;
      else edgeDir = 0;
    });

    window.addEventListener('mouseleave', () => {
      edgeDir = 0;
    });

    window.addEventListener('click', (event) => {
      raycaster.setFromCamera(mouse, camera);
      const intersections = raycaster.intersectObjects(folders, true);
      if (!intersections.length) return;
      let obj = intersections[0].object;
      while (obj && !folders.includes(obj)) obj = obj.parent;
      if (!obj) return;
      const index = folders.indexOf(obj);
      setSelected(index);
    });

    function updateLabels() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      labels.forEach((label, i) => {
        const folder = folders[i];
        const position = folder.position.clone().project(camera);
        if (position.z > 1) {
          label.classList.add('hidden');
          return;
        }
        label.classList.remove('hidden');
        const x = (position.x * 0.5 + 0.5) * width;
        const y = (-position.y * 0.5 + 0.5) * height;
        const scaleInfluence = THREE.MathUtils.clamp(folder.userData.alignAlpha, 0, 1);
        const scale = 1 + (aligned ? (i === selectedIndex ? 0.25 : 0.05) : 0);
        label.style.left = `${x}px`;
        label.style.top = `${y + 32}px`;
        label.style.transform = `translate(-50%, 0) scale(${scale})`;
        label.style.opacity = 0.72 + scaleInfluence * 0.25;
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const now = performance.now();

      folders.forEach((folder, i) => {
        const data = folder.userData;
        data.alignClock += delta;
        const timeInto = Math.max(0, data.alignClock - data.alignDelay);
        const ratio = data.alignDuration <= 0 ? 1 : Math.min(1, timeInto / data.alignDuration);
        const eased = easeInOut(ratio);
        const planned = THREE.MathUtils.lerp(data.alignFrom, alignmentGoal, eased);
        data.alignAlpha += (planned - data.alignAlpha) * 0.22;

        const orbit = data.orbit;
        const orbitSlow = THREE.MathUtils.lerp(1, 0.2, data.alignAlpha);
        orbit.angle += orbit.speed * delta * orbitSlow;
        const orbX = Math.cos(orbit.angle) * orbit.radius;
        const orbZ = Math.sin(orbit.angle) * orbit.radius * 0.62;
        const orbY = Math.sin(orbit.angle * 1.35 + orbit.bobPhase) * orbit.vertical + 0.4;
        orbit.position.set(orbX, orbY, orbZ);
      });

      const alignStrength = folders.reduce((sum, folder) => sum + folder.userData.alignAlpha, 0) / Math.max(1, folders.length);

      if (alignmentGoal > 0.5) {
        selectionVelocity += (targetSelection - currentSelection) * 0.08;
        selectionVelocity *= 0.88;
        currentSelection += selectionVelocity;
        currentSelection = THREE.MathUtils.clamp(currentSelection, 0, folders.length - 1);
      } else {
        selectionVelocity *= 0.85;
        currentSelection += selectionVelocity;
        currentSelection += (Math.max(0, Math.min(folders.length - 1, selectedIndex >= 0 ? selectedIndex : currentSelection)) - currentSelection) * 0.04;
      }

      folders.forEach((folder, i) => {
        const data = folder.userData;
        const orbit = data.orbit;
        const alignAlpha = THREE.MathUtils.clamp(data.alignAlpha, 0, 1);

        const offset = i - currentSelection;
        const alignPos = new THREE.Vector3(
          offset * spacing,
          topY - Math.min(Math.abs(offset) * 0.28, 0.7),
          -Math.min(Math.abs(offset) * 0.22, 1)
        );
        const orbitPos = orbit.position;
        const targetPos = orbitPos.clone().lerp(alignPos, alignAlpha);
        folder.position.x += (targetPos.x - folder.position.x) * (0.12 + alignAlpha * 0.35);
        folder.position.y += (targetPos.y - folder.position.y) * (0.11 + alignAlpha * 0.3);
        folder.position.z += (targetPos.z - folder.position.z) * (0.1 + alignAlpha * 0.28);

        const alignScale = i === Math.round(currentSelection)
          ? selectedScale
          : THREE.MathUtils.clamp(baseScale + (1 - Math.min(Math.abs(offset), 1.8)) * 0.18, baseScale * 0.85, selectedScale * 0.9);
        const targetScale = THREE.MathUtils.lerp(baseScale, alignScale, alignAlpha);
        const newScale = THREE.MathUtils.lerp(folder.scale.x, targetScale, 0.2 + alignAlpha * 0.3);
        folder.scale.setScalar(newScale);

        const orbitRotX = Math.sin(orbit.angle * 0.9 + orbit.swayPhase) * 0.18;
        const orbitRotY = Math.sin(orbit.angle * 0.6) * 0.25;
        const orbitRotZ = Math.cos(orbit.angle * 0.8) * 0.15;

        const velocityInfluence = selectionVelocity * (i - currentSelection);
        const alignRotY = THREE.MathUtils.clamp(velocityInfluence * 1.05, -0.4, 0.4);
        const alignRotX = Math.sin(now * 0.0012 + i) * 0.03 + THREE.MathUtils.clamp(-velocityInfluence * 0.3, -0.25, 0.25);
        const alignRotZ = THREE.MathUtils.clamp(-velocityInfluence * 0.6, -0.45, 0.45);

        const targetRotX = THREE.MathUtils.lerp(orbitRotX, alignRotX, alignAlpha);
        const targetRotY = THREE.MathUtils.lerp(orbitRotY, alignRotY, alignAlpha);
        const targetRotZ = THREE.MathUtils.lerp(orbitRotZ, alignRotZ, alignAlpha);

        folder.rotation.x += (targetRotX - folder.rotation.x) * 0.18;
        folder.rotation.y += (targetRotY - folder.rotation.y) * 0.18;
        folder.rotation.z += (targetRotZ - folder.rotation.z) * 0.18;
      });

      if (edgeDir !== 0 && alignStrength > 0.6 && folders.length) {
        edgeTimer += delta * 1000;
        if (edgeTimer > hoverDelay) {
          edgeTimer = 0;
          const next = THREE.MathUtils.clamp(Math.round(targetSelection + edgeDir), 0, folders.length - 1);
          if (next !== targetSelection) {
            targetSelection = next;
            selectedIndex = next;
            updateLabelSelection();
          }
        }
      } else {
        edgeTimer = 0;
      }

      const orbitLightPos = new THREE.Vector3(3.5, 5.8, 8);
      const alignLightPos = new THREE.Vector3(7, 9.5, 16);
      const lightTarget = orbitLightPos.clone().lerp(alignLightPos, alignStrength);
      keyLight.position.lerp(lightTarget, 0.06 + alignStrength * 0.08);
      keyLight.intensity = THREE.MathUtils.lerp(0.32, 0.22, alignStrength);

      renderer.render(scene, camera);
      updateLabels();
      drawNetwork(delta, alignStrength);
    }

    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      networkCanvas.width = window.innerWidth;
      networkCanvas.height = window.innerHeight;
      regenerateNetwork();
      updateLabels();
    }

    window.addEventListener('resize', onResize);

    initFolders();
    regenerateNetwork();
    animate();
  </script>
</body>
</html>
