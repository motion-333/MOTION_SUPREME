<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Folder Orbit</title>
  <style>
    @font-face {
      font-family: 'Ferrite';
      src: url('/static/FERRITEDISPLAYVF.ttf') format('truetype');
      font-weight: 100 900;
    }
    @font-face {
      font-family: 'Outfit';
      src: url('/static/OutfitVariableFont.ttf') format('truetype');
      font-weight: 100 900;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      cursor: none;
    }
    #sceneWrap {
      position: fixed;
      inset: 0;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #bgCanvas { z-index: 0; }
    #fgCanvas { z-index: 1; pointer-events: none; }
    #networkCanvas {
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #networkCanvas.visible { opacity: 1; }
    #labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      font-family: 'Ferrite', sans-serif;
      color: var(--accent-color, #1449ff);
      transition: color 0.35s ease;
    }
    #showcasePanel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(68vw, 960px);
      display: flex;
      flex-direction: column;
      gap: clamp(18px, 3vh, 42px);
      font-family: 'Outfit', sans-serif;
      color: var(--accent-color, #1449ff);
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 4;
    }
    #showcasePanel.visible {
      opacity: 1;
    }
    .showcase-line {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: clamp(22px, 3vw, 48px);
    }
    .showcase-line .index {
      font-size: clamp(0.65rem, 1.6vw, 1rem);
      letter-spacing: 0.28em;
      font-variation-settings: 'wght' 620;
      margin-top: clamp(0.2rem, 0.8vh, 0.6rem);
    }
    .showcase-word {
      display: flex;
      justify-content: flex-start;
      width: 100%;
      font-size: clamp(2.6rem, 7vw, 7.5rem);
      line-height: 0.92;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: auto;
      font-family: 'Outfit', sans-serif;
    }
    .showcase-word .letter {
      display: inline-block;
      overflow: hidden;
      transition: width 0.2s cubic-bezier(.25,.1,.25,1);
    }
    .showcase-word .letter .char {
      display: inline-block;
      transform-origin: left center;
      transition: transform 0.2s cubic-bezier(.25,.1,.25,1), font-variation-settings 0.2s cubic-bezier(.25,.1,.25,1);
      font-variation-settings: 'wght' 400;
    }
    .label {
      position: absolute;
      transform: translate(-50%, 0);
      text-transform: uppercase;
      letter-spacing: 0.045em;
      font-weight: 700;
      font-variation-settings: 'wght' 820;
      transition: opacity 0.3s ease;
      opacity: 0.9;
      white-space: nowrap;
      font-size: clamp(0.5rem, 0.9vw, 0.95rem);
    }
    .label.selected {
      opacity: 1;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="sceneWrap">
    <canvas id="bgCanvas"></canvas>
    <canvas id="fgCanvas"></canvas>
    <canvas id="networkCanvas"></canvas>
    <div id="labels"></div>
    <div id="showcasePanel"></div>
  </div>

  <script src="https://unpkg.com/three@0.148.0/build/three.min.js"></script>
  <script>
    const DEFAULT_FOLDERS = ['Ads', 'Music Videos', 'Zines', 'Events', 'Graphics', 'Web'];

    const sceneWrap = document.getElementById('sceneWrap');
    const bgCanvas = document.getElementById('bgCanvas');
    const fgCanvas = document.getElementById('fgCanvas');
    const networkCanvas = document.getElementById('networkCanvas');
    const labelsContainer = document.getElementById('labels');
    const showcasePanel = document.getElementById('showcasePanel');

    const bgRenderer = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias: true, alpha: true });
    bgRenderer.setClearColor(0x000000, 0);
    const fgRenderer = new THREE.WebGLRenderer({ canvas: fgCanvas, antialias: true, alpha: true });
    fgRenderer.setClearColor(0, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 16;

    const ambient = new THREE.AmbientLight(0xffffff, 0.88);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.12);
    dirLight.position.set(0, 0.5, 6);
    scene.add(dirLight);
    const rimLight = new THREE.DirectionalLight(0x8ecbff, 0.12);
    rimLight.position.set(-6, 3.5, -6);
    scene.add(rimLight);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const cursor3D = new THREE.Vector3();
    const targetMouse = { x: 0, y: 0 };
    const currentMouse = { x: 0, y: 0 };
    let magnetized = null;

    const folders = [];
    const labels = [];

    let mode = 'orbit';
    let selectedIndex = -1;
    let alignActivatedAt = 0;
    const alignDuration = 900;
    let alignSpacing = 3.2;
    let alignTopY = 3.6;
    let alignColumnX = -5.0;
    const baseAlignTilt = THREE.MathUtils.degToRad(-8);
    const selectedOffsetX = 0.9;
    const selectedAlignScale = 1.22;
    const alignDepth = 0.22;
    let lastSelectionChange = 0;
    const SELECTION_COOLDOWN = 320;

    const alignEase = t => t < 0.5 ? 2 * t * t : (-1 + (4 - 2 * t) * t);
    const orbitEase = alignEase;

    function sendPointerMessage(type, event) {
      if (!parent) return;
      const payload = { type };
      if (event) {
        payload.x = event.clientX;
        payload.y = event.clientY;
      }
      parent.postMessage({ orbitPointer: payload }, '*');
    }

    const networkCtx = networkCanvas.getContext('2d');
    const networkPoints = [];
    const NETWORK_COUNT = 17;
    let accentColor = '#1449ff';
    let networkAccent = accentColor;
    const CHARACTER_SEQUENCE = ['M', 'O', 'T', 'I', 'O', 'N', '3', '3', '3'];
    const SHOWCASE_MAP = {
      'Ads': ['REDSTAR', 'AUXDESCALES', 'BURGERKING'],
      'Music Videos': ['CANINE', 'SOF', 'EDMOND WELLS'],
      'Events': ['AGORA', 'LULUVANTRAPP'],
      'Graphics': ['COVERS'],
      'Web': ['TRATT', 'ADELE'],
      'Zines': ['NARVIK']
    };
    function computeVisibleMetrics() {
      const distance = Math.abs(camera.position.z);
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeight = 2 * Math.tan(verticalFov / 2) * distance;
      const visibleWidth = visibleHeight * camera.aspect;
      return { visibleWidth, visibleHeight };
    }

    function updateLayoutMetrics() {
      const { visibleWidth, visibleHeight } = computeVisibleMetrics();
      const paddingTop = visibleHeight * 0.24;
      const paddingBottom = visibleHeight * 0.18;
      const len = Math.max(folders.length, 1);
      const usableHeight = Math.max(visibleHeight - paddingTop - paddingBottom, 0.1);
      const baseSpacing = visibleHeight * 0.12;
      alignSpacing = len > 1 ? Math.max(baseSpacing, usableHeight / (len - 1)) : 0;
      alignTopY = visibleHeight / 2 - paddingTop;
      const leftInset = Math.min(visibleWidth * 0.18, 2.6);
      alignColumnX = -visibleWidth / 2 + leftInset;
      labelsContainer.style.setProperty('--accent-color', accentColor);
      rimLight.color.set('#8ecbff');
      positionShowcasePanel();
    }

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      bgRenderer.setSize(w, h);
      fgRenderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      networkCanvas.width = w;
      networkCanvas.height = h;
      updateLayoutMetrics();
    }
    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('pointermove', e => {
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = -(e.clientY / window.innerHeight - 0.5) * 2;
      if (mode === 'align') {
        targetMouse.x = nx * 0.4;
        targetMouse.y = ny * 0.4;
      } else {
        targetMouse.x = nx;
        targetMouse.y = ny;
      }
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const d = -raycaster.ray.origin.z / raycaster.ray.direction.z;
      cursor3D.copy(raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(d)));
      sendPointerMessage('move', e);
    });

    sceneWrap.addEventListener('pointerenter', e => sendPointerMessage('enter', e));
    sceneWrap.addEventListener('pointerleave', () => sendPointerMessage('leave'));
    window.addEventListener('pointerdown', e => sendPointerMessage('down', e));
    window.addEventListener('pointerup', e => sendPointerMessage('up', e));

    const ease = t => t < 0.5 ? 2 * t * t : (-1 + (4 - 2 * t) * t);

    function createFolder(name) {
      const g = new THREE.Group();
      const frontMat = new THREE.MeshStandardMaterial({ color: 0x89d8fd, roughness: 0.4, metalness: 0.2 });
      const backMat  = new THREE.MeshStandardMaterial({ color: 0x5bbde9, roughness: 0.45, metalness: 0.15 });
      const w = 2.5, h = 1.8, r = 0.15;
      const shape = new THREE.Shape();
      shape.moveTo(-w/2 + r, -h/2)
           .lineTo(w/2 - r, -h/2)
           .quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r)
           .lineTo(w/2, h/2 - r)
           .quadraticCurveTo(w/2, h/2, w/2 - r, h/2)
           .lineTo(-w/2 + r, h/2)
           .quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r)
           .lineTo(-w/2, -h/2 + r)
           .quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);
      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.03,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2
      });
      const front = new THREE.Mesh(geom, frontMat);
      front.geometry.translate(0, 0.9, 0);
      front.position.z = 0.015;
      front.castShadow = true;
      g.add(front);
      const back = new THREE.Mesh(geom.clone(), backMat);
      back.scale.y = 1.07;
      back.position.set(0, 0.05, -0.015);
      back.receiveShadow = true;
      g.add(back);
      const baseScale = 0.88;
      g.scale.set(baseScale, baseScale, baseScale);

      const lipShape = new THREE.Shape();
      lipShape.moveTo(-1.25, 0)
              .quadraticCurveTo(-1.25, 0.2, -1.1, 0.2)
              .lineTo(-0.6, 0.2)
              .quadraticCurveTo(-0.45, 0.2, -0.3, 0)
              .lineTo(-0.3, -0.3)
              .quadraticCurveTo(-0.32, -0.43, -0.6, -0.43)
              .lineTo(-1.22, -0.42)
              .quadraticCurveTo(-1.28, -0.38, -1.24, -0.3)
              .lineTo(-1.25, 0);
      const lip = new THREE.Mesh(new THREE.ExtrudeGeometry(lipShape, {
        depth: 0.03,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2
      }), backMat);
      lip.position.set(0, 1.9, -0.015);
      lip.receiveShadow = true;
      g.add(lip);

      const dir = new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 0).normalize();
      g.userData = {
        name,
        front,
        dir,
        speed: 0.002 + Math.random() * 0.001,
        curvePhase: Math.random() * Math.PI * 2,
        curveScale: 0.005 + Math.random() * 0.003,
        focused: false,
        clickStart: 0,
        startPos: new THREE.Vector3(),
        targetPos: new THREE.Vector3(),
        duration: 1000,
        innerR: 1.2,
        hoverPhase: 0,
        returning: false,
        returnStart: 0,
        returnFrom: new THREE.Vector3(),
        returnTo: new THREE.Vector3(),
        returnDuration: 1000,
        spin: false,
        spinElapsed: 0,
        spinDuration: 1,
        magnetStart: 0,
        startScale: new THREE.Vector3(),
        targetScale: new THREE.Vector3(),
        scaleReturnFrom: new THREE.Vector3(),
        scaleReturnTo: new THREE.Vector3(),
        alignDelay: 0,
        alignFrom: null,
        alignFromScale: null,
        alignFromRot: null,
        orbitAnchor: new THREE.Vector3(),
        lastAlignPos: new THREE.Vector3(),
        twist: { y: 0, z: 0 },
        loopShift: 0,
        baseScale,
        frontMat,
        backMat
      };
      return g;
    }

    function computeAlignTarget(i, len) {
      const spacing = len > 1 ? alignSpacing : 0;
      const y = alignTopY - i * spacing;
      const baseX = alignColumnX;
      const offsetX = i === selectedIndex ? selectedOffsetX : 0;
      const z = i === selectedIndex ? 0 : alignDepth;
      const baseScale = folders[i]?.userData.baseScale || 1;
      const scale = i === selectedIndex ? baseScale * selectedAlignScale : baseScale;
      return {
        position: new THREE.Vector3(baseX + offsetX, y, z),
        scale
      };
    }

    function circularDistance(a, b, len) {
      const diff = Math.abs(a - b);
      return Math.min(diff, len - diff);
    }

    function setTargetSelection(index) {
      if (!folders.length) return;
      const len = folders.length;
      const normalized = ((index % len) + len) % len;
      const now = performance.now();
      if (now - lastSelectionChange < SELECTION_COOLDOWN) return;
      if (selectedIndex === normalized) return;
      lastSelectionChange = now;
      selectedIndex = normalized;
      prepareAlignTargets(false);
      rebuildNetwork();
      updateShowcasePanel();
    }

    function rebuildNetwork() {
      networkPoints.length = 0;
      for (let i = 0; i < NETWORK_COUNT; i++) {
        networkPoints.push({
          x: (0.36 + Math.random() * 0.58) * networkCanvas.width,
          y: (0.16 + Math.random() * 0.68) * networkCanvas.height,
          vx: (Math.random() - 0.5) * 0.12,
          vy: (Math.random() - 0.5) * 0.12,
          charIndex: Math.floor(Math.random() * CHARACTER_SEQUENCE.length),
          timer: 0,
          delay: 240 + Math.random() * 240
        });
      }
    }

    function drawNetwork(dt) {
      networkCtx.clearRect(0, 0, networkCanvas.width, networkCanvas.height);
      if (mode !== 'align') return;
      const width = networkCanvas.width;
      const height = networkCanvas.height;
      const minX = width * 0.3;
      const maxX = width * 0.96;
      const minY = height * 0.14;
      const maxY = height * 0.86;
      networkPoints.forEach(p => {
        p.x += p.vx * dt * 0.06;
        p.y += p.vy * dt * 0.06;
        if (p.x < minX || p.x > maxX) {
          p.vx *= -1;
          p.x = THREE.MathUtils.clamp(p.x, minX, maxX);
        }
        if (p.y < minY || p.y > maxY) {
          p.vy *= -1;
          p.y = THREE.MathUtils.clamp(p.y, minY, maxY);
        }
        p.timer += dt;
        if (p.timer >= p.delay) {
          p.timer = 0;
          p.delay = 240 + Math.random() * 240;
          p.charIndex = (p.charIndex + 1) % CHARACTER_SEQUENCE.length;
        }
      });
      networkCtx.strokeStyle = networkAccent;
      networkCtx.lineWidth = 1;
      networkCtx.globalAlpha = 0.22;
      const edges = new Set();
      for (let i = 0; i < networkPoints.length; i++) {
        const a = networkPoints[i];
        const distList = [];
        for (let j = 0; j < networkPoints.length; j++) {
          if (i === j) continue;
          const b = networkPoints[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          distList.push({ j, dx, dy, dist });
        }
        distList.sort((m, n) => m.dist - n.dist);
        const needed = Math.min(3, distList.length);
        for (let k = 0; k < needed; k++) {
          const { j, dx, dy, dist } = distList[k];
          if (!Number.isFinite(dist) || dist === 0) continue;
          const key = i < j ? `${i}-${j}` : `${j}-${i}`;
          if (edges.has(key)) continue;
          edges.add(key);
          const gap = 5;
          const inv = 1 / dist;
          const offsetX = dx * inv * gap;
          const offsetY = dy * inv * gap;
          networkCtx.beginPath();
          networkCtx.moveTo(a.x + offsetX, a.y + offsetY);
          networkCtx.lineTo(a.x + dx - offsetX, a.y + dy - offsetY);
          networkCtx.stroke();
        }
      }
      for (let i = 0; i < networkPoints.length; i++) {
        const j = (i + 1) % networkPoints.length;
        if (i === j) continue;
        const key = i < j ? `${i}-${j}` : `${j}-${i}`;
        const a = networkPoints[i];
        const b = networkPoints[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (!edges.has(key)) {
          edges.add(key);
          const gap = 5;
          const inv = 1 / dist;
          const offsetX = dx * inv * gap;
          const offsetY = dy * inv * gap;
          networkCtx.beginPath();
          networkCtx.moveTo(a.x + offsetX, a.y + offsetY);
          networkCtx.lineTo(a.x + dx - offsetX, a.y + dy - offsetY);
          networkCtx.stroke();
        }
      }
      networkCtx.globalAlpha = 1;
      networkCtx.fillStyle = networkAccent;
      networkCtx.font = '600 18px Ferrite, sans-serif';
      networkCtx.textAlign = 'center';
      networkCtx.textBaseline = 'middle';
      networkPoints.forEach(p => {
        const ch = CHARACTER_SEQUENCE[p.charIndex];
        networkCtx.fillText(ch, p.x, p.y);
      });
    }

    function clearShowcasePanel() {
      if (!showcasePanel) return;
      showcasePanel.innerHTML = '';
      showcasePanel.style.width = '';
      showcasePanel.style.transform = 'translate(-50%, -50%)';
    }

    function setupInteractiveWord(container) {
      const letters = Array.from(container.children);
      if (!letters.length) return;
      const baseWidths = [];
      let sumBase = 0;
      letters.forEach(out => {
        const inn = out.firstElementChild;
        inn.style.transform = 'scaleX(1)';
        const width = inn.getBoundingClientRect().width;
        baseWidths.push(width);
        sumBase += width;
      });
      const totalWidth = sumBase > 0 ? sumBase : Math.max(container.getBoundingClientRect().width, 1);
      const S = sumBase > 0 ? totalWidth / sumBase : 1;
      const hoverScale = 1.8;
      const neighborScale = 1.2;
      const normalWeight = 400;
      const neighborWeight = 600;
      const hoverWeight = 900;
      container.style.width = `${totalWidth}px`;
      letters.forEach((out, i) => {
        const inn = out.firstElementChild;
        out.style.width = `${baseWidths[i] * S}px`;
        inn.style.width = `${baseWidths[i]}px`;
        inn.style.transform = `scaleX(${S})`;
        inn.style.fontVariationSettings = `'wght' ${normalWeight}`;
      });
      letters.forEach((out, i) => {
        out.addEventListener('mouseenter', () => {
          const wH = baseWidths[i] * S;
          const wN = (i > 0 ? baseWidths[i - 1] * S : 0) + (i < letters.length - 1 ? baseWidths[i + 1] * S : 0);
          const wO = Math.max(totalWidth - wH - wN, 0.0001);
          const R_h = hoverScale;
          const R_n = neighborScale;
          const R_o = (totalWidth - wH * R_h - wN * R_n) / wO;
          letters.forEach((node, j) => {
            const inn = node.firstElementChild;
            let ratio = R_o;
            let weight = normalWeight;
            if (j === i) {
              ratio = R_h;
              weight = hoverWeight;
            } else if (j === i - 1 || j === i + 1) {
              ratio = R_n;
              weight = neighborWeight;
            }
            node.style.width = `${baseWidths[j] * S * ratio}px`;
            inn.style.transform = `scaleX(${S * ratio})`;
            inn.style.fontVariationSettings = `'wght' ${weight}`;
          });
        });
        out.addEventListener('mouseleave', () => {
          letters.forEach((node, j) => {
            const inn = node.firstElementChild;
            node.style.width = `${baseWidths[j] * S}px`;
            inn.style.transform = `scaleX(${S})`;
            inn.style.fontVariationSettings = `'wght' ${normalWeight}`;
          });
        });
      });
    }

    function createInteractiveWord(text) {
      const word = document.createElement('div');
      word.className = 'showcase-word';
      Array.from(text).forEach(ch => {
        const outer = document.createElement('span');
        outer.className = 'letter';
        const inner = document.createElement('span');
        inner.className = 'char';
        inner.textContent = ch;
        outer.appendChild(inner);
        word.appendChild(outer);
      });
      requestAnimationFrame(() => setupInteractiveWord(word));
      return word;
    }

    function updateShowcasePanel() {
      if (!showcasePanel) return;
      if (mode !== 'align' || selectedIndex < 0 || !folders[selectedIndex]) {
        showcasePanel.classList.remove('visible');
        clearShowcasePanel();
        return;
      }
      clearShowcasePanel();
      const folderName = folders[selectedIndex].userData.name;
      const entries = SHOWCASE_MAP[folderName] || [];
      if (!entries.length) {
        showcasePanel.classList.remove('visible');
        return;
      }
      entries.forEach((label, idx) => {
        const line = document.createElement('div');
        line.className = 'showcase-line';
        const indexLabel = document.createElement('span');
        indexLabel.className = 'index';
        indexLabel.textContent = String(idx + 1).padStart(2, '0');
        const word = createInteractiveWord(label);
        line.appendChild(indexLabel);
        line.appendChild(word);
        showcasePanel.appendChild(line);
      });
      showcasePanel.style.setProperty('--accent-color', accentColor);
      showcasePanel.classList.add('visible');
      requestAnimationFrame(positionShowcasePanel);
    }

    function positionShowcasePanel() {
      if (!showcasePanel) return;
      if (mode !== 'align' || selectedIndex < 0 || !folders[selectedIndex]) {
        showcasePanel.style.transform = 'translate(-50%, -50%)';
        return;
      }
      const len = folders.length || 1;
      const target = computeAlignTarget(selectedIndex, len);
      const projected = target.position.clone().project(camera);
      const screenX = (projected.x * 0.5 + 0.5) * window.innerWidth;
      const screenY = (-projected.y * 0.5 + 0.5) * window.innerHeight;
      const rawLeft = Math.max(screenX + 60, 60);
      const availableWidth = Math.max(window.innerWidth - rawLeft - 40, 260);
      showcasePanel.style.width = `${availableWidth}px`;
      const panelWidth = showcasePanel.offsetWidth || availableWidth;
      const maxLeft = Math.max(window.innerWidth - panelWidth - 32, 60);
      const left = Math.min(Math.max(rawLeft, 60), maxLeft);
      showcasePanel.style.left = `${left}px`;
      const panelHeight = showcasePanel.offsetHeight || 0;
      const bottomLimit = Math.max(window.innerHeight - panelHeight - 40, 60);
      const top = Math.min(Math.max(screenY - panelHeight / 2, 60), bottomLimit);
      showcasePanel.style.top = `${top}px`;
      showcasePanel.style.right = 'auto';
      showcasePanel.style.bottom = 'auto';
      showcasePanel.style.transform = 'none';
    }

    function initFolders(list = DEFAULT_FOLDERS) {
      folders.forEach(f => scene.remove(f));
      folders.length = 0;
      labelsContainer.innerHTML = '';
      labels.length = 0;
      list.forEach(name => {
        const f = createFolder(name);
        scene.add(f);
        folders.push(f);
        const lbl = document.createElement('div');
        lbl.className = 'label';
        lbl.textContent = name.toUpperCase();
        labelsContainer.appendChild(lbl);
        labels.push(lbl);
        const startX = (Math.random() - 0.5) * 6;
        const startY = (Math.random() - 0.5) * 3;
        const startZ = (Math.random() - 0.5) * 0.6;
        f.position.set(startX, startY, startZ);
        f.userData.orbitAnchor.copy(f.position);
      });
      mode = 'orbit';
      selectedIndex = -1;
      magnetized = null;
      rebuildNetwork();
      networkCanvas.classList.remove('visible');
      updateLayoutMetrics();
      if (showcasePanel) {
        showcasePanel.classList.remove('visible');
        clearShowcasePanel();
      }
    }

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(folders.map(f => f.userData.front));
      if (!hits.length) return;
      const f = hits[0].object.parent;
      const idx = folders.indexOf(f);
      if (idx === -1) return;
      if (mode === 'orbit') {
        selectedIndex = idx;
        enterAlign();
      } else {
        if (idx === selectedIndex) {
          exitAlign();
        } else {
          setTargetSelection(idx);
        }
      }
    });

    function enterAlign() {
      mode = 'align';
      alignActivatedAt = performance.now();
      folders.forEach(f => {
        const ud = f.userData;
        ud.orbitAnchor.copy(f.position);
      });
      prepareAlignTargets(true);
      rebuildNetwork();
      networkCanvas.classList.add('visible');
    }

    function prepareAlignTargets(stagger = false) {
      alignActivatedAt = performance.now();
      updateLayoutMetrics();
      const len = folders.length || 1;
      folders.forEach((f, i) => {
        const ud = f.userData;
        const target = computeAlignTarget(i, len);
        ud.alignFrom = f.position.clone();
        ud.alignFromScale = f.scale.clone();
        ud.alignFromRot = f.rotation.clone();
        ud.alignTo = target.position;
        ud.alignToScale = target.scale;
        const delay = stagger ? circularDistance(i, selectedIndex, len) * 120 : 0;
        ud.alignStart = alignActivatedAt + delay;
        ud.alignDuration = alignDuration;
      });
      updateShowcasePanel();
    }

    function exitAlign() {
      mode = 'orbit';
      networkCanvas.classList.remove('visible');
      folders.forEach(f => {
        const ud = f.userData;
        ud.returning = true;
        ud.returnStart = performance.now();
        ud.returnFrom.copy(f.position);
        ud.returnTo.copy(ud.orbitAnchor);
        ud.scaleReturnFrom.copy(f.scale);
        const base = ud.baseScale || 1.05;
        ud.scaleReturnTo.set(base, base, base);
      });
      selectedIndex = -1;
      if (showcasePanel) {
        showcasePanel.classList.remove('visible');
        clearShowcasePanel();
      }
    }

    function updateLabels(selectedIdx) {
      labels.forEach((lbl, i) => {
        if (!folders[i]) return;
        const f = folders[i];
        const v = f.position.clone().project(camera);
        const x = (v.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-v.y * 0.5 + 0.5) * window.innerHeight + 8;
        lbl.style.left = `${x}px`;
        lbl.style.top = `${y}px`;
        if (selectedIdx === i) lbl.classList.add('selected');
        else lbl.classList.remove('selected');
      });
    }

    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = now - lastTime;
      lastTime = now;

      if (mode === 'align') {
        magnetized = null;
        dirLight.position.lerp(new THREE.Vector3(0, 5.5, 22), 0.08);
        const len = folders.length || 1;
        folders.forEach((f, i) => {
          const ud = f.userData;
          const start = ud.alignStart ?? alignActivatedAt;
          const duration = ud.alignDuration || alignDuration;
          const t = THREE.MathUtils.clamp((now - start) / duration, 0, 1);
          const tt = alignEase(t);
          const fromPos = ud.alignFrom || f.position.clone();
          const targetInfo = ud.alignTo ? { position: ud.alignTo, scale: ud.alignToScale } : computeAlignTarget(i, len);
          const targetPos = targetInfo.position;
          f.position.copy(fromPos.clone().lerp(targetPos, tt));
          const fromScale = ud.alignFromScale || f.scale.clone();
          const targetScaleValue = targetInfo.scale || ud.baseScale || 1;
          const targetScaleVec = new THREE.Vector3(targetScaleValue, targetScaleValue, targetScaleValue);
          f.scale.copy(fromScale.clone().lerp(targetScaleVec, tt));
          const fromRot = ud.alignFromRot || f.rotation.clone();
          const rotX = THREE.MathUtils.lerp(fromRot.x, baseAlignTilt, tt);
          f.rotation.set(rotX, 0, 0);
          ud.front.rotation.x += (THREE.MathUtils.degToRad(9) - ud.front.rotation.x) * 0.12;
        });
        updateLabels(selectedIndex);
        drawNetwork(dt);
        positionShowcasePanel();
      } else {
        dirLight.position.lerp(new THREE.Vector3(0, 0.2, 6.5), 0.06);
        raycaster.setFromCamera(mouse, camera);
        const hoverHits = raycaster.intersectObjects(folders.map(f => f.userData.front));
        folders.forEach(f => {
          f.userData.hovered = hoverHits.some(h => h.object === f.userData.front);
        });
        const accel = Math.hypot(targetMouse.x - currentMouse.x, targetMouse.y - currentMouse.y);
        if (magnetized && accel > 2) magnetized = null;
        folders.forEach(f => {
          const ud = f.userData;
          const to = cursor3D.clone().sub(f.position);
          const d = to.length();
          if (magnetized === f && now - ud.magnetStart > 2000) magnetized = null;
          if (d < ud.innerR && accel > 3 && !ud.spin) {
            ud.spin = true;
            ud.spinElapsed = 0;
          }
          if (ud.spin) {
            ud.spinElapsed += 0.1;
            f.rotation.y = (ud.spinElapsed / ud.spinDuration) * Math.PI * 2;
            if (ud.spinElapsed >= ud.spinDuration) {
              ud.spin = false;
              f.rotation.y = 0;
            }
            return;
          }
          if ((magnetized === null || magnetized === f) && d < ud.innerR) {
            magnetized = f;
            ud.magnetStart = now;
            const repel = new THREE.Vector3();
            folders.forEach(o => {
              if (o !== f) {
                const dv = f.position.clone().sub(o.position);
                const distSq = dv.lengthSq();
                if (distSq < 16) repel.add(dv.normalize().multiplyScalar(0.04));
              }
            });
            f.position.add(repel);
            const offset = new THREE.Vector3(0, -0.9, 0);
            f.position.lerp(cursor3D.clone().add(offset), 0.045);
            ud.hoverPhase += 0.1;
            ud.front.rotation.x += (THREE.MathUtils.degToRad(15) - ud.front.rotation.x) * 0.1;
            const breeze = accel * 0.25;
            f.rotation.y += (Math.sin(ud.hoverPhase) * breeze - f.rotation.y) * 0.2;
            f.rotation.z += (Math.cos(ud.hoverPhase) * breeze * 0.5 - f.rotation.z) * 0.2;
            return;
          }
          if (ud.returning) {
            const t = Math.min((now - ud.returnStart) / ud.returnDuration, 1);
            f.position.lerpVectors(ud.returnFrom, ud.returnTo, orbitEase(t));
            f.scale.lerpVectors(ud.scaleReturnFrom, ud.scaleReturnTo, orbitEase(t));
            if (t >= 1) {
              ud.returning = false;
            }
            return;
          }
          f.rotation.y += (0 - f.rotation.y) * 0.2;
          f.rotation.z += (0 - f.rotation.z) * 0.2;
          if (ud.hovered) ud.front.rotation.x += (THREE.MathUtils.degToRad(15) - ud.front.rotation.x) * 0.1;
          else ud.front.rotation.x += (0 - ud.front.rotation.x) * 0.1;
          ud.curvePhase += 0.01;
          const repel2 = new THREE.Vector3();
          folders.forEach(o => {
            if (o !== f) {
              const dv = f.position.clone().sub(o.position);
              const sq = dv.lengthSq();
              if (sq < 100) repel2.add(dv.normalize().multiplyScalar(0.08 / sq));
            }
          });
          const curveVec = new THREE.Vector3(
            Math.sin(ud.curvePhase),
            Math.sin(ud.curvePhase * 0.9),
            Math.cos(ud.curvePhase * 0.8)
          ).multiplyScalar(ud.curveScale);
          const cf = new THREE.Vector3();
          const magR = 5;
          if (d < magR && d > ud.innerR) cf.add(to.normalize().multiplyScalar((magR - d) / magR * 0.02));
          f.position.add(
            ud.dir.clone().multiplyScalar(ud.speed)
              .add(curveVec)
              .add(repel2)
              .add(cf)
          );
          ['x', 'y'].forEach(a => {
            if (f.position[a] > 5 || f.position[a] < -5) ud.dir[a] *= -1;
          });
          f.position.z = Math.max(-0.4, Math.min(0.4, f.position.z));
          ud.orbitAnchor.copy(f.position);
        });
        updateLabels(-1);
        networkCtx.clearRect(0, 0, networkCanvas.width, networkCanvas.height);
      }

      dirLight.position.x += (targetMouse.x * 10 - dirLight.position.x) * 0.1;
      dirLight.position.y += (targetMouse.y * 10 - dirLight.position.y) * 0.1;
      const a2 = Math.hypot(targetMouse.x - currentMouse.x, targetMouse.y - currentMouse.y);
      currentMouse.x += (targetMouse.x - currentMouse.x) * 0.02 * a2;
      currentMouse.y += (targetMouse.y - currentMouse.y) * 0.02 * a2;
      const cameraFactorX = mode === 'align' ? 1.6 : 3;
      const cameraFactorY = mode === 'align' ? 1.4 : 3;
      camera.position.set(currentMouse.x * cameraFactorX, currentMouse.y * cameraFactorY, 16);
      camera.lookAt(0, 0, 0);

      bgRenderer.render(scene, camera);
      folders.forEach(f => f.visible = true);
      fgRenderer.render(scene, camera);
    }
    animate();

    window.addEventListener('message', e => {
      if (e.data && Array.isArray(e.data.folders)) {
        initFolders(e.data.folders);
      }
      if (e.data && e.data.theme && e.data.theme.accent) {
        accentColor = e.data.theme.accent;
        networkAccent = accentColor;
        labelsContainer.style.setProperty('--accent-color', accentColor);
        if (showcasePanel) {
          showcasePanel.style.setProperty('--accent-color', accentColor);
        }
      }
    });

    initFolders();
    parent.postMessage({ requestFolders: true }, '*');
  </script>
</body>
</html>
