<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Folder Orbit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap');
    @font-face {
      font-family: 'Ferrite';
      src: url('/static/FERRITEDISPLAYVF.ttf') format('truetype');
      font-weight: 100 900;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    #sceneWrap {
      position: fixed;
      inset: 0;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #bgCanvas { z-index: 0; }
    #fgCanvas { z-index: 1; pointer-events: none; }
    #networkCanvas {
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #networkCanvas.visible { opacity: 1; }
    #labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      font-family: 'Ferrite', sans-serif;
      color: var(--accent-color, #1449ff);
      transition: color 0.35s ease;
    }
    #showcasePanel {
      position: absolute;
      top: 50%;
      left: clamp(48px, 10vw, 168px);
      transform: translateY(-50%);
      width: min(38vw, 560px);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2.4vh, 32px);
      align-items: flex-start;
      font-family: 'Roboto Flex', 'Ferrite', sans-serif;
      color: var(--accent-color, #1449ff);
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 4;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      padding-right: 4px;
      padding-left: 4px;
      scrollbar-width: thin;
    }
    #showcasePanel.visible {
      opacity: 1;
    }
    .showcase-line {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: flex-start;
      gap: clamp(8px, 1.6vw, 24px);
      transition: height 0.35s ease, gap 0.35s ease;
      height: auto;
    }
    .showcase-line .index {
      font-size: clamp(0.58rem, 1.4vw, 0.92rem);
      letter-spacing: 0.18em;
      font-variation-settings: 'wght' 650;
      margin-top: clamp(0.12rem, 0.45vh, 0.4rem);
      font-family: 'Ferrite', sans-serif;
      pointer-events: none;
      transition: transform 0.3s ease;
    }
    .showcase-word {
      display: flex;
      justify-content: flex-start;
      width: 100%;
      font-size: clamp(2.2rem, 6.4vw, 7rem);
      line-height: 0.9;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: auto;
      font-family: 'Roboto Flex', 'Ferrite', sans-serif;
      transform-origin: left top;
      transition: transform 0.35s ease;
    }
    .showcase-word .letter {
      display: inline-block;
      overflow: hidden;
      transition: width 0.2s ease;
    }
    .showcase-word .letter .char {
      display: inline-block;
      transform-origin: left center;
      transition: transform 0.2s ease, font-variation-settings 0.2s ease;
      font-variation-settings: 'wght' 400;
    }
    .label {
      position: absolute;
      transform: translate(-50%, 0);
      text-transform: uppercase;
      letter-spacing: 0.045em;
      font-weight: 700;
      font-variation-settings: 'wght' 820;
      transition: opacity 0.3s ease;
      opacity: 0.9;
      white-space: nowrap;
      font-size: clamp(0.5rem, 0.9vw, 0.95rem);
    }
    .label.selected {
      opacity: 1;
      letter-spacing: 0.08em;
    }

    #gifPreview {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    .gif-card {
      position: absolute;
      border: 4px solid var(--accent-color, #1449ff);
      border-radius: 0;
      overflow: hidden;
      background: rgba(20, 73, 255, 0.08);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      animation-name: gifEnter, cardBob;
      animation-duration: 0.45s, var(--bob-duration, 7.2s);
      animation-timing-function: ease, ease-in-out;
      animation-delay: var(--enter-delay, 0s), var(--bob-delay, 0s);
      animation-fill-mode: forwards, none;
      animation-iteration-count: 1, infinite;
      animation-direction: normal, alternate;
    }

    .gif-card .gif-card-inner {
      width: 100%;
      height: 100%;
      transform-origin: center;
      animation: cardFloat 6s ease-in-out infinite alternate;
    }

    .gif-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gif-card.dropping {
      animation: gifDrop 0.5s cubic-bezier(.33, .8, .48, 1) forwards;
    }

    @keyframes gifEnter {
      from {
        opacity: 0;
        transform: translate(-50%, -60%) scale(0.75);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes gifDrop {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 110vh) scale(0.94);
      }
    }

    @keyframes cardFloat {
      from {
        transform: rotate(var(--float-from, -3deg));
      }
      to {
        transform: rotate(var(--float-to, 3deg));
      }
    }

    @keyframes cardBob {
      from {
        margin-top: calc(var(--bob-range, 18px) * -1);
      }
      to {
        margin-top: var(--bob-range, 18px);
      }
    }
  </style>
</head>
<body>
  <div id="sceneWrap">
    <canvas id="bgCanvas"></canvas>
    <canvas id="fgCanvas"></canvas>
    <canvas id="networkCanvas"></canvas>
    <div id="labels"></div>
    <div id="showcasePanel"></div>
    <div id="gifPreview"></div>
  </div>

  <script src="https://unpkg.com/three@0.148.0/build/three.min.js"></script>
  <script>
    const DEFAULT_SHOWCASE = {
      'Ads': [
        { index: '01', label: 'REDSTAR', media: [] },
        { index: '02', label: 'AUXDESCALES', media: [] },
        { index: '03', label: 'BURGERKING', media: [] }
      ],
      'Music Videos': [
        { index: '01', label: 'CANINE', media: [] },
        { index: '02', label: 'SOF', media: [] },
        { index: '03', label: 'EDMOND WELLS', media: [] }
      ],
      'Events': [
        { index: '01', label: 'AGORA', media: [] },
        { index: '02', label: 'LULUVANTRAPP', media: [] }
      ],
      'Graphics': [
        { index: '01', label: 'COVERS', media: [] }
      ],
      'Web': [
        { index: '01', label: 'TRATT', media: [] },
        { index: '02', label: 'ADELE', media: [] }
      ],
      'Zines': [
        { index: '01', label: 'NARVIK', media: [] }
      ]
    };

    const DEFAULT_FOLDERS = Object.keys(DEFAULT_SHOWCASE);

    const sceneWrap = document.getElementById('sceneWrap');
    const bgCanvas = document.getElementById('bgCanvas');
    const fgCanvas = document.getElementById('fgCanvas');
    const networkCanvas = document.getElementById('networkCanvas');
    const labelsContainer = document.getElementById('labels');
    const showcasePanel = document.getElementById('showcasePanel');
    const gifPreview = document.getElementById('gifPreview');

    const bgRenderer = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias: true, alpha: true });
    bgRenderer.setClearColor(0x000000, 0);
    const fgRenderer = new THREE.WebGLRenderer({ canvas: fgCanvas, antialias: true, alpha: true });
    fgRenderer.setClearColor(0, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 16;

    const ambient = new THREE.AmbientLight(0xffffff, 0.88);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.12);
    dirLight.position.set(0, 0.5, 6);
    scene.add(dirLight);
    const rimLight = new THREE.DirectionalLight(0x8ecbff, 0.12);
    rimLight.position.set(-6, 3.5, -6);
    scene.add(rimLight);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const cursor3D = new THREE.Vector3();
    const targetMouse = { x: 0, y: 0 };
    const currentMouse = { x: 0, y: 0 };
    let magnetized = null;

    const folders = [];
    const labels = [];

    let mode = 'orbit';
    let selectedIndex = -1;
    let alignActivatedAt = 0;
    const alignDuration = 900;
    let alignSpacing = 3.2;
    let alignTopY = 3.6;
    let alignColumnX = -5.0;
    const baseAlignTilt = THREE.MathUtils.degToRad(-8);
    const selectedOffsetX = 0.9;
    const selectedAlignScale = 1.22;
    const alignDepth = 0.22;
    let lastSelectionChange = 0;
    const SELECTION_COOLDOWN = 320;

    const alignEase = t => t < 0.5 ? 2 * t * t : (-1 + (4 - 2 * t) * t);
    const orbitEase = alignEase;

    function notifyTopoPulse(strength = 0.8) {
      if (!parent) return;
      parent.postMessage({ topoPulse: strength }, '*');
    }

    const networkCtx = networkCanvas.getContext('2d');
    const networkPoints = [];
    const NETWORK_COUNT = 17;
    let accentColor = '#1449ff';
    let networkAccent = accentColor;
    const CHARACTER_SEQUENCE = ['M', 'O', 'T', 'I', 'O', 'N', '3', '3', '3'];

    function sanitizeFeatureVideo(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const url = typeof raw.url === 'string' ? raw.url.trim() : '';
      if (!url) return null;
      const aspectRatio = typeof raw.aspectRatio === 'string' ? raw.aspectRatio.trim() : '';
      return {
        url,
        aspectRatio: aspectRatio || '16:9'
      };
    }

    function cloneShowcase(map = {}) {
      const result = {};
      Object.keys(map).forEach(key => {
        const list = Array.isArray(map[key]) ? map[key] : [];
        result[key] = list.map((entry, idx) => {
          if (entry && typeof entry === 'object') {
            const label = String(entry.label ?? '').trim() || String(entry.id ?? '').replace(/^[0-9]+_/, '').replace(/_/g, ' ');
            const index = String(entry.index ?? entry.id ?? idx + 1).split('_')[0];
            const media = Array.isArray(entry.media)
              ? entry.media.map(src => String(src))
              : [];
            const featureVideo = sanitizeFeatureVideo(entry.featureVideo);
            return {
              index: index ? index.padStart(2, '0') : String(idx + 1).padStart(2, '0'),
              label: label.toUpperCase(),
              media,
              ...(featureVideo ? { featureVideo } : {})
            };
          }
          const raw = String(entry ?? '').replace(/^[0-9]+_/, '');
          return {
            index: String(idx + 1).padStart(2, '0'),
            label: raw.replace(/_/g, ' ').toUpperCase(),
            media: []
          };
        });
      });
      return result;
    }

    function setPortfolioShowcase(map) {
      const clone = cloneShowcase(map);
      portfolioShowcase = Object.keys(clone).length ? clone : cloneShowcase(DEFAULT_SHOWCASE);
    }

    function getShowcaseEntries(folderName) {
      const entries = portfolioShowcase[folderName];
      if (!entries || !entries.length) return [];
      return entries.map((entry, idx) => {
        const featureVideo = sanitizeFeatureVideo(entry.featureVideo);
        const payload = {
          index: entry.index ? String(entry.index).padStart(2, '0') : String(idx + 1).padStart(2, '0'),
          label: entry.label ? String(entry.label).toUpperCase() : '',
          media: Array.isArray(entry.media) ? entry.media.map(src => String(src)) : []
        };
        return featureVideo ? { ...payload, featureVideo } : payload;
      });
    }

    let portfolioShowcase = cloneShowcase(DEFAULT_SHOWCASE);
    let showcaseActiveIndex = -1;
    function computeVisibleMetrics() {
      const distance = Math.abs(camera.position.z);
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeight = 2 * Math.tan(verticalFov / 2) * distance;
      const visibleWidth = visibleHeight * camera.aspect;
      return { visibleWidth, visibleHeight };
    }

    function updateLayoutMetrics() {
      const { visibleWidth, visibleHeight } = computeVisibleMetrics();
      const paddingTop = visibleHeight * 0.24;
      const paddingBottom = visibleHeight * 0.18;
      const len = Math.max(folders.length, 1);
      const usableHeight = Math.max(visibleHeight - paddingTop - paddingBottom, 0.1);
      const baseSpacing = visibleHeight * 0.12;
      alignSpacing = len > 1 ? Math.max(baseSpacing, usableHeight / (len - 1)) : 0;
      alignTopY = visibleHeight / 2 - paddingTop;
      const leftInset = Math.min(visibleWidth * 0.18, 2.6);
      alignColumnX = -visibleWidth / 2 + leftInset;
      labelsContainer.style.setProperty('--accent-color', accentColor);
      rimLight.color.set('#8ecbff');
      positionShowcasePanel();
      if (gifPreview) {
        gifPreview.style.setProperty('--accent-color', accentColor);
      }
    }

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      bgRenderer.setSize(w, h);
      fgRenderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      networkCanvas.width = w;
      networkCanvas.height = h;
      updateLayoutMetrics();
    }
    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('pointermove', e => {
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = -(e.clientY / window.innerHeight - 0.5) * 2;
      if (mode === 'align') {
        targetMouse.x = nx * 0.4;
        targetMouse.y = ny * 0.4;
      } else {
        targetMouse.x = nx;
        targetMouse.y = ny;
      }
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const d = -raycaster.ray.origin.z / raycaster.ray.direction.z;
      cursor3D.copy(raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(d)));
    });

    const ease = t => t < 0.5 ? 2 * t * t : (-1 + (4 - 2 * t) * t);

    function createFolder(name) {
      const g = new THREE.Group();
      const frontMat = new THREE.MeshStandardMaterial({ color: 0x89d8fd, roughness: 0.4, metalness: 0.2 });
      const backMat  = new THREE.MeshStandardMaterial({ color: 0x5bbde9, roughness: 0.45, metalness: 0.15 });
      const w = 2.5, h = 1.8, r = 0.15;
      const shape = new THREE.Shape();
      shape.moveTo(-w/2 + r, -h/2)
           .lineTo(w/2 - r, -h/2)
           .quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r)
           .lineTo(w/2, h/2 - r)
           .quadraticCurveTo(w/2, h/2, w/2 - r, h/2)
           .lineTo(-w/2 + r, h/2)
           .quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r)
           .lineTo(-w/2, -h/2 + r)
           .quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);
      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.03,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2
      });
      const front = new THREE.Mesh(geom, frontMat);
      front.geometry.translate(0, 0.9, 0);
      front.position.z = 0.015;
      front.castShadow = true;
      g.add(front);
      const back = new THREE.Mesh(geom.clone(), backMat);
      back.scale.y = 1.07;
      back.position.set(0, 0.05, -0.015);
      back.receiveShadow = true;
      g.add(back);
      const baseScale = 0.88;
      g.scale.set(baseScale, baseScale, baseScale);

      const lipShape = new THREE.Shape();
      lipShape.moveTo(-1.25, 0)
              .quadraticCurveTo(-1.25, 0.2, -1.1, 0.2)
              .lineTo(-0.6, 0.2)
              .quadraticCurveTo(-0.45, 0.2, -0.3, 0)
              .lineTo(-0.3, -0.3)
              .quadraticCurveTo(-0.32, -0.43, -0.6, -0.43)
              .lineTo(-1.22, -0.42)
              .quadraticCurveTo(-1.28, -0.38, -1.24, -0.3)
              .lineTo(-1.25, 0);
      const lip = new THREE.Mesh(new THREE.ExtrudeGeometry(lipShape, {
        depth: 0.03,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2
      }), backMat);
      lip.position.set(0, 1.9, -0.015);
      lip.receiveShadow = true;
      g.add(lip);

      const dir = new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 0).normalize();
      g.userData = {
        name,
        front,
        dir,
        speed: 0.002 + Math.random() * 0.001,
        curvePhase: Math.random() * Math.PI * 2,
        curveScale: 0.005 + Math.random() * 0.003,
        focused: false,
        clickStart: 0,
        startPos: new THREE.Vector3(),
        targetPos: new THREE.Vector3(),
        duration: 1000,
        innerR: 1.2,
        hoverPhase: 0,
        returning: false,
        returnStart: 0,
        returnFrom: new THREE.Vector3(),
        returnTo: new THREE.Vector3(),
        returnDuration: 1000,
        spin: false,
        spinElapsed: 0,
        spinDuration: 1,
        magnetStart: 0,
        startScale: new THREE.Vector3(),
        targetScale: new THREE.Vector3(),
        scaleReturnFrom: new THREE.Vector3(),
        scaleReturnTo: new THREE.Vector3(),
        alignDelay: 0,
        alignFrom: null,
        alignFromScale: null,
        alignFromRot: null,
        orbitAnchor: new THREE.Vector3(),
        lastAlignPos: new THREE.Vector3(),
        twist: { y: 0, z: 0 },
        loopShift: 0,
        baseScale,
        frontMat,
        backMat
      };
      return g;
    }

    function computeAlignTarget(i, len) {
      const spacing = len > 1 ? alignSpacing : 0;
      const y = alignTopY - i * spacing;
      const baseX = alignColumnX;
      const offsetX = i === selectedIndex ? selectedOffsetX : 0;
      const z = i === selectedIndex ? 0 : alignDepth;
      const baseScale = folders[i]?.userData.baseScale || 1;
      const scale = i === selectedIndex ? baseScale * selectedAlignScale : baseScale;
      return {
        position: new THREE.Vector3(baseX + offsetX, y, z),
        scale
      };
    }

    function circularDistance(a, b, len) {
      const diff = Math.abs(a - b);
      return Math.min(diff, len - diff);
    }

    function setTargetSelection(index) {
      if (!folders.length) return;
      const len = folders.length;
      const normalized = ((index % len) + len) % len;
      const now = performance.now();
      if (now - lastSelectionChange < SELECTION_COOLDOWN) return;
      if (selectedIndex === normalized) return;
      lastSelectionChange = now;
      selectedIndex = normalized;
      showcaseActiveIndex = -1;
      prepareAlignTargets(false);
      rebuildNetwork();
      notifyTopoPulse(0.85);
    }

    function rebuildNetwork() {
      networkPoints.length = 0;
      for (let i = 0; i < NETWORK_COUNT; i++) {
        networkPoints.push({
          x: (0.36 + Math.random() * 0.58) * networkCanvas.width,
          y: (0.16 + Math.random() * 0.68) * networkCanvas.height,
          vx: (Math.random() - 0.5) * 0.12,
          vy: (Math.random() - 0.5) * 0.12,
          charIndex: Math.floor(Math.random() * CHARACTER_SEQUENCE.length),
          timer: 0,
          delay: 240 + Math.random() * 240
        });
      }
    }

    function drawNetwork(dt) {
      networkCtx.clearRect(0, 0, networkCanvas.width, networkCanvas.height);
      if (mode !== 'align') return;
      const width = networkCanvas.width;
      const height = networkCanvas.height;
      const minX = width * 0.3;
      const maxX = width * 0.96;
      const minY = height * 0.14;
      const maxY = height * 0.86;
      networkPoints.forEach(p => {
        p.x += p.vx * dt * 0.06;
        p.y += p.vy * dt * 0.06;
        if (p.x < minX || p.x > maxX) {
          p.vx *= -1;
          p.x = THREE.MathUtils.clamp(p.x, minX, maxX);
        }
        if (p.y < minY || p.y > maxY) {
          p.vy *= -1;
          p.y = THREE.MathUtils.clamp(p.y, minY, maxY);
        }
        p.timer += dt;
        if (p.timer >= p.delay) {
          p.timer = 0;
          p.delay = 240 + Math.random() * 240;
          p.charIndex = (p.charIndex + 1) % CHARACTER_SEQUENCE.length;
        }
      });
      networkCtx.strokeStyle = networkAccent;
      networkCtx.lineWidth = 1.6;
      networkCtx.globalAlpha = 0.22;
      const edges = new Set();
      for (let i = 0; i < networkPoints.length; i++) {
        const a = networkPoints[i];
        const distList = [];
        for (let j = 0; j < networkPoints.length; j++) {
          if (i === j) continue;
          const b = networkPoints[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          distList.push({ j, dx, dy, dist });
        }
        distList.sort((m, n) => m.dist - n.dist);
        const needed = Math.min(3, distList.length);
        for (let k = 0; k < needed; k++) {
          const { j, dx, dy, dist } = distList[k];
          if (!Number.isFinite(dist) || dist === 0) continue;
          const key = i < j ? `${i}-${j}` : `${j}-${i}`;
          if (edges.has(key)) continue;
          edges.add(key);
          const gap = 5;
          const inv = 1 / dist;
          const offsetX = dx * inv * gap;
          const offsetY = dy * inv * gap;
          networkCtx.beginPath();
          networkCtx.moveTo(a.x + offsetX, a.y + offsetY);
          networkCtx.lineTo(a.x + dx - offsetX, a.y + dy - offsetY);
          networkCtx.stroke();
        }
      }
      for (let i = 0; i < networkPoints.length; i++) {
        const j = (i + 1) % networkPoints.length;
        if (i === j) continue;
        const key = i < j ? `${i}-${j}` : `${j}-${i}`;
        const a = networkPoints[i];
        const b = networkPoints[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (!edges.has(key)) {
          edges.add(key);
          const gap = 5;
          const inv = 1 / dist;
          const offsetX = dx * inv * gap;
          const offsetY = dy * inv * gap;
          networkCtx.beginPath();
          networkCtx.moveTo(a.x + offsetX, a.y + offsetY);
          networkCtx.lineTo(a.x + dx - offsetX, a.y + dy - offsetY);
          networkCtx.stroke();
        }
      }
      networkCtx.globalAlpha = 1;
      networkCtx.fillStyle = networkAccent;
      networkCtx.font = '600 18px "Roboto Flex", sans-serif';
      networkCtx.textAlign = 'center';
      networkCtx.textBaseline = 'middle';
      networkPoints.forEach(p => {
        const ch = CHARACTER_SEQUENCE[p.charIndex];
        networkCtx.fillText(ch, p.x, p.y);
      });
    }

    let currentPreviewKey = '';
    let previewClearTimer = null;

    function dropExistingCards({ immediate = false } = {}) {
      if (!gifPreview) return;
      const cards = Array.from(gifPreview.children);
      cards.forEach(card => {
        if (immediate) {
          card.remove();
          return;
        }
        card.classList.add('dropping');
        card.style.animationDelay = '0s';
        card.addEventListener('animationend', () => card.remove(), { once: true });
      });
    }

    function renderGifCards(list) {
      if (!gifPreview) return;
      const limited = list.slice(0, 5);
      const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 1280;
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 720;
      const minX = viewportWidth * 0.55;
      const maxX = viewportWidth * 0.9;
      const minY = viewportHeight * 0.18;
      const maxY = viewportHeight * 0.86;

      limited.forEach((raw, idx) => {
        const src = encodeURI(raw);
        const card = document.createElement('div');
        card.className = 'gif-card';

        const baseSize = Math.random() * 80 + 120;
        const size = Math.min(baseSize, viewportWidth * 0.18);
        const posX = Math.min(Math.max(minX + Math.random() * (maxX - minX), minX), maxX);
        const posY = Math.min(Math.max(minY + Math.random() * (maxY - minY), minY), maxY);

        card.style.width = `${size}px`;
        card.style.height = `${size}px`;
        card.style.left = `${posX}px`;
        card.style.top = `${posY}px`;
        const enterDelay = (idx * 0.05).toFixed(2);
        const bobDelay = (Math.random() * 1.4).toFixed(2);
        const floatRange = (Math.random() * 4 + 2).toFixed(2);
        const floatBase = (Math.random() * 10 - 5).toFixed(2);
        const floatDuration = (Math.random() * 3 + 5).toFixed(2);
        const bobRange = (Math.random() * 16 + 10).toFixed(2);

        card.style.setProperty('--float-from', `${parseFloat(floatBase) - parseFloat(floatRange)}deg`);
        card.style.setProperty('--float-to', `${parseFloat(floatBase) + parseFloat(floatRange)}deg`);
        card.style.setProperty('--enter-delay', `${enterDelay}s`);
        card.style.setProperty('--bob-delay', `${bobDelay}s`);
        card.style.setProperty('--bob-duration', `${floatDuration}s`);
        card.style.setProperty('--bob-range', `${bobRange}px`);

        const inner = document.createElement('div');
        inner.className = 'gif-card-inner';
        inner.style.animationDuration = `${floatDuration}s`;
        inner.style.animationDelay = `${Math.random() * 1.4}s`;

        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        inner.appendChild(img);
        card.appendChild(inner);

        gifPreview.appendChild(card);
      });
    }

    function setGifPreview(mediaList, { immediate = false } = {}) {
      if (!gifPreview) return;
      clearTimeout(previewClearTimer);
      const cleaned = Array.isArray(mediaList)
        ? mediaList.filter(src => typeof src === 'string' && src.trim())
        : [];
      if (!cleaned.length) {
        currentPreviewKey = '';
        dropExistingCards({ immediate });
        return;
      }
      const key = cleaned.join('|');
      if (key === currentPreviewKey) return;
      currentPreviewKey = key;
      const hadCards = gifPreview.childElementCount > 0;
      dropExistingCards({ immediate });
      const delay = immediate || !hadCards ? 0 : 220;
      window.setTimeout(() => renderGifCards(cleaned), delay);
    }

    function schedulePreviewClear() {
      clearTimeout(previewClearTimer);
      previewClearTimer = window.setTimeout(() => {
        if (showcaseActiveIndex >= 0) {
          const lines = Array.from(showcasePanel ? showcasePanel.querySelectorAll('.showcase-line') : []);
          const activeLine = lines[showcaseActiveIndex];
          if (activeLine) {
            setGifPreview(activeLine._entryMedia, { immediate: true });
            return;
          }
        }
        setGifPreview(null);
      }, 140);
    }

    if (showcasePanel) {
      showcasePanel.addEventListener('pointerleave', schedulePreviewClear);
      showcasePanel.addEventListener('pointerenter', () => clearTimeout(previewClearTimer));
    }

    function clearShowcasePanel() {
      if (!showcasePanel) return;
      showcasePanel.innerHTML = '';
      showcasePanel.style.width = '';
      showcasePanel.style.transform = 'translateY(-50%)';
      showcasePanel.scrollTop = 0;
      setGifPreview(null);
    }

    function makeInteractive(container) {
      const hoverScale = 1.8, neighborScale = 1.2;
      const normalWght = 400, neighborWght = 600, hoverWght = 900;
      const letters = Array.from(container.children);
      if (!letters.length) return;
      const baseWidths = [];
      let sumBase = 0;
      letters.forEach(out => {
        const inn = out.firstElementChild;
        inn.style.transform = 'scaleX(1)';
        const w = inn.getBoundingClientRect().width;
        baseWidths.push(w);
        sumBase += w;
      });
      const totalW = container.getBoundingClientRect().width || sumBase || 1;
      const S = totalW / (sumBase || 1);
      letters.forEach((out, i) => {
        const inn = out.firstElementChild;
        out.style.width = baseWidths[i] * S + 'px';
        inn.style.width = baseWidths[i] + 'px';
        inn.style.transform = `scaleX(${S})`;
        inn.style.fontVariationSettings = `'wght' ${normalWght}`;
      });
      letters.forEach((out, i) => {
        out.addEventListener('mouseenter', () => {
          const wH = baseWidths[i] * S;
          const wN = (i > 0 ? baseWidths[i - 1] * S : 0) + (i < letters.length - 1 ? baseWidths[i + 1] * S : 0);
          const wO = Math.max(totalW - wH - wN, 0.0001);
          const R_h = hoverScale, R_n = neighborScale;
          const R_o = (totalW - wH * R_h - wN * R_n) / wO;
          letters.forEach((node, j) => {
            const ch = node.firstElementChild;
            const R = j === i ? R_h : (j === i - 1 || j === i + 1 ? R_n : R_o);
            const wght = j === i ? hoverWght : (j === i - 1 || j === i + 1 ? neighborWght : normalWght);
            node.style.width = baseWidths[j] * S * R + 'px';
            ch.style.transform = `scaleX(${S * R})`;
            ch.style.fontVariationSettings = `'wght' ${wght}`;
          });
        });
        out.addEventListener('mouseleave', () => {
          letters.forEach((node, j) => {
            const ch = node.firstElementChild;
            node.style.width = baseWidths[j] * S + 'px';
            ch.style.transform = `scaleX(${S})`;
            ch.style.fontVariationSettings = `'wght' ${normalWght}`;
          });
        });
      });
    }

    function setupInteractiveWord(container, targetWidth = null) {
      if (targetWidth !== null && Number.isFinite(targetWidth)) {
        container.style.width = `${targetWidth}px`;
      } else {
        container.style.removeProperty('width');
      }
      makeInteractive(container);
    }

    function setShowcaseActive(index) {
      if (!showcasePanel) return;
      const lines = Array.from(showcasePanel.querySelectorAll('.showcase-line'));
      if (!lines.length) return;
      const hasSelection = typeof index === 'number' && index >= 0 && index < lines.length;
      showcaseActiveIndex = hasSelection ? index : -1;
      const activeScale = hasSelection ? 3 : 1;
      lines.forEach((line, idx) => {
        const selected = idx === showcaseActiveIndex;
        const scale = selected ? activeScale : 1;
        const baseHeight = parseFloat(line.dataset.baseHeight || '') || line.getBoundingClientRect().height || 1;
        const word = line.querySelector('.showcase-word');
        line.classList.toggle('selected', selected);
        line.style.height = `${baseHeight * scale}px`;
        if (word) {
          word.style.transform = `scaleY(${scale})`;
          word.style.transformOrigin = 'left top';
        }
        if (!selected && !hasSelection && word) {
          word.style.transform = 'scaleY(1)';
        }
      });
      if (hasSelection) {
        const activeLine = lines[showcaseActiveIndex];
        if (activeLine) {
          setGifPreview(activeLine._entryMedia);
        }
        activeLine.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      } else {
        setGifPreview(null);
      }
      requestAnimationFrame(() => positionShowcasePanel());
    }

    function captureShowcaseMetrics() {
      if (!showcasePanel) return;
      const lines = Array.from(showcasePanel.querySelectorAll('.showcase-line'));
      lines.forEach(line => {
        const rect = line.getBoundingClientRect();
        line.dataset.baseHeight = rect.height.toString();
        line.style.height = `${rect.height}px`;
        const word = line.querySelector('.showcase-word');
        if (word) {
          word.style.transformOrigin = 'left top';
          word.style.transform = 'scaleY(1)';
        }
      });
    }

    function createInteractiveWord(text) {
      const word = document.createElement('div');
      word.className = 'showcase-word';
      Array.from(text).forEach(ch => {
        const outer = document.createElement('span');
        outer.className = 'letter';
        const inner = document.createElement('span');
        inner.className = 'char';
        inner.textContent = ch;
        outer.appendChild(inner);
        word.appendChild(outer);
      });
      return word;
    }

    function updateShowcasePanel() {
      if (!showcasePanel) return;
      if (mode !== 'align' || selectedIndex < 0 || !folders[selectedIndex]) {
        showcasePanel.classList.remove('visible');
        clearShowcasePanel();
        return;
      }
      clearShowcasePanel();
      const folderName = folders[selectedIndex].userData.name;
      const entries = getShowcaseEntries(folderName);
      if (!entries.length) {
        showcasePanel.classList.remove('visible');
        return;
      }
      entries.forEach((entry, idx) => {
        const line = document.createElement('div');
        line.className = 'showcase-line';
        const indexLabel = document.createElement('span');
        indexLabel.className = 'index';
        indexLabel.textContent = entry.index || String(idx + 1).padStart(2, '0');
        const word = createInteractiveWord(entry.label || '');
        line.appendChild(indexLabel);
        line.appendChild(word);
        line.tabIndex = 0;
        line._entryMedia = Array.isArray(entry.media) ? entry.media.map(src => String(src)) : [];
        line.addEventListener('click', () => {
          setShowcaseActive(idx);
          notifyTopoPulse(0.55);
        });
        line.addEventListener('keydown', evt => {
          if (evt.key === 'Enter' || evt.key === ' ') {
            evt.preventDefault();
            setShowcaseActive(idx);
            notifyTopoPulse(0.55);
          }
        });
        let holdTimer = null;
        let holdOrigin = null;
        const cancelHold = () => {
          if (holdTimer) {
            clearTimeout(holdTimer);
            holdTimer = null;
          }
        };
        line.addEventListener('pointerenter', evt => {
          setGifPreview(line._entryMedia);
          holdOrigin = { x: evt.clientX, y: evt.clientY };
          cancelHold();
          holdTimer = window.setTimeout(() => {
            setShowcaseActive(idx);
            notifyTopoPulse(0.45);
            cancelHold();
          }, 3000);
        });
        line.addEventListener('pointerleave', () => {
          holdOrigin = null;
          cancelHold();
          schedulePreviewClear();
        });
        line.addEventListener('pointermove', evt => {
          if (!holdTimer || !holdOrigin) return;
          const dist = Math.hypot(evt.clientX - holdOrigin.x, evt.clientY - holdOrigin.y);
          if (dist > 12) {
            holdOrigin = { x: evt.clientX, y: evt.clientY };
            cancelHold();
            holdTimer = window.setTimeout(() => {
              setShowcaseActive(idx);
              notifyTopoPulse(0.45);
              cancelHold();
            }, 3000);
          }
        });
        line.addEventListener('pointerdown', () => {
          cancelHold();
        });
        line.addEventListener('pointercancel', () => {
          cancelHold();
          schedulePreviewClear();
        });
        line.addEventListener('focus', () => {
          setGifPreview(line._entryMedia);
        });
        line.addEventListener('blur', () => {
          schedulePreviewClear();
        });
      showcasePanel.appendChild(line);
      });
      showcasePanel.style.setProperty('--accent-color', accentColor);
      if (gifPreview) {
        gifPreview.style.setProperty('--accent-color', accentColor);
      }
      requestAnimationFrame(() => {
        positionShowcasePanel();
        requestAnimationFrame(() => {
          const panelRect = showcasePanel.getBoundingClientRect();
          const panelWidth = Math.max(panelRect.width, 1);
          const words = Array.from(showcasePanel.querySelectorAll('.showcase-word'));
          let targetWidth = 0;
          const lineGaps = new WeakMap();
          words.forEach(word => {
            const line = word.parentElement;
            const styles = window.getComputedStyle(line);
            const gap = parseFloat(styles.columnGap || styles.gap || '0');
            lineGaps.set(line, gap);
          });
          words.forEach(word => {
            const line = word.parentElement;
            const gap = lineGaps.get(line) || 0;
            const indexEl = word.previousElementSibling;
            const indexWidth = indexEl ? indexEl.getBoundingClientRect().width : 0;
            const available = Math.max(panelWidth - indexWidth - gap, 1);
            targetWidth = Math.max(targetWidth, available);
          });
          targetWidth = Math.max(targetWidth, 1);
          words.forEach(word => setupInteractiveWord(word, targetWidth));
          captureShowcaseMetrics();
          setShowcaseActive(showcaseActiveIndex);
          showcasePanel.classList.add('visible');
        });
      });
    }

    function positionShowcasePanel() {
      if (!showcasePanel) return;
      const baseWidth = Math.min(Math.max(window.innerWidth * 0.32, 260), 520);
      showcasePanel.style.width = `${baseWidth}px`;
    }

    function initFolders(list) {
      const source = Array.isArray(list) && list.length ? list : Object.keys(portfolioShowcase);
      const names = source.length ? source : DEFAULT_FOLDERS;
      folders.forEach(f => scene.remove(f));
      folders.length = 0;
      labelsContainer.innerHTML = '';
      labels.length = 0;
      names.forEach(name => {
        const f = createFolder(name);
        scene.add(f);
        folders.push(f);
        const lbl = document.createElement('div');
        lbl.className = 'label';
        lbl.textContent = name.toUpperCase();
        labelsContainer.appendChild(lbl);
        labels.push(lbl);
        const startX = (Math.random() - 0.5) * 6;
        const startY = (Math.random() - 0.5) * 3;
        const startZ = (Math.random() - 0.5) * 0.6;
        f.position.set(startX, startY, startZ);
        f.userData.orbitAnchor.copy(f.position);
      });
      mode = 'orbit';
      selectedIndex = -1;
      showcaseActiveIndex = -1;
      magnetized = null;
      rebuildNetwork();
      networkCanvas.classList.remove('visible');
      updateLayoutMetrics();
      if (showcasePanel) {
        showcasePanel.classList.remove('visible');
        clearShowcasePanel();
      }
    }

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(folders.map(f => f.userData.front));
      if (!hits.length) return;
      const f = hits[0].object.parent;
      const idx = folders.indexOf(f);
      if (idx === -1) return;
      if (mode === 'orbit') {
        selectedIndex = idx;
        enterAlign();
      } else {
        if (idx === selectedIndex) {
          exitAlign();
        } else {
          setTargetSelection(idx);
        }
      }
    });

    function enterAlign() {
      mode = 'align';
      alignActivatedAt = performance.now();
      folders.forEach(f => {
        const ud = f.userData;
        ud.orbitAnchor.copy(f.position);
      });
      prepareAlignTargets(true);
      rebuildNetwork();
      networkCanvas.classList.add('visible');
      notifyTopoPulse(1.1);
    }

    function prepareAlignTargets(stagger = false) {
      alignActivatedAt = performance.now();
      updateLayoutMetrics();
      const len = folders.length || 1;
      folders.forEach((f, i) => {
        const ud = f.userData;
        const target = computeAlignTarget(i, len);
        ud.alignFrom = f.position.clone();
        ud.alignFromScale = f.scale.clone();
        ud.alignFromRot = f.rotation.clone();
        ud.alignTo = target.position;
        ud.alignToScale = target.scale;
        const delay = stagger ? circularDistance(i, selectedIndex, len) * 120 : 0;
        ud.alignStart = alignActivatedAt + delay;
        ud.alignDuration = alignDuration;
      });
      updateShowcasePanel();
    }

    function exitAlign() {
      mode = 'orbit';
      networkCanvas.classList.remove('visible');
      folders.forEach(f => {
        const ud = f.userData;
        ud.returning = true;
        ud.returnStart = performance.now();
        ud.returnFrom.copy(f.position);
        ud.returnTo.copy(ud.orbitAnchor);
        ud.scaleReturnFrom.copy(f.scale);
        const base = ud.baseScale || 1.05;
        ud.scaleReturnTo.set(base, base, base);
      });
      selectedIndex = -1;
      if (showcasePanel) {
        showcasePanel.classList.remove('visible');
        clearShowcasePanel();
      }
      notifyTopoPulse(0.6);
    }

    function updateLabels(selectedIdx) {
      labels.forEach((lbl, i) => {
        if (!folders[i]) return;
        const f = folders[i];
        const v = f.position.clone().project(camera);
        const x = (v.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-v.y * 0.5 + 0.5) * window.innerHeight + 8;
        lbl.style.left = `${x}px`;
        lbl.style.top = `${y}px`;
        if (selectedIdx === i) lbl.classList.add('selected');
        else lbl.classList.remove('selected');
      });
    }

    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = now - lastTime;
      lastTime = now;

      if (mode === 'align') {
        magnetized = null;
        dirLight.position.lerp(new THREE.Vector3(0, 5.5, 22), 0.08);
        const len = folders.length || 1;
        folders.forEach((f, i) => {
          const ud = f.userData;
          const start = ud.alignStart ?? alignActivatedAt;
          const duration = ud.alignDuration || alignDuration;
          const t = THREE.MathUtils.clamp((now - start) / duration, 0, 1);
          const tt = alignEase(t);
          const fromPos = ud.alignFrom || f.position.clone();
          const targetInfo = ud.alignTo ? { position: ud.alignTo, scale: ud.alignToScale } : computeAlignTarget(i, len);
          const targetPos = targetInfo.position;
          f.position.copy(fromPos.clone().lerp(targetPos, tt));
          const fromScale = ud.alignFromScale || f.scale.clone();
          const targetScaleValue = targetInfo.scale || ud.baseScale || 1;
          const targetScaleVec = new THREE.Vector3(targetScaleValue, targetScaleValue, targetScaleValue);
          f.scale.copy(fromScale.clone().lerp(targetScaleVec, tt));
          const fromRot = ud.alignFromRot || f.rotation.clone();
          const rotX = THREE.MathUtils.lerp(fromRot.x, baseAlignTilt, tt);
          f.rotation.set(rotX, 0, 0);
          ud.front.rotation.x += (THREE.MathUtils.degToRad(9) - ud.front.rotation.x) * 0.12;
        });
        updateLabels(selectedIndex);
        drawNetwork(dt);
        positionShowcasePanel();
      } else {
        dirLight.position.lerp(new THREE.Vector3(0, 0.2, 6.5), 0.06);
        raycaster.setFromCamera(mouse, camera);
        const hoverHits = raycaster.intersectObjects(folders.map(f => f.userData.front));
        folders.forEach(f => {
          f.userData.hovered = hoverHits.some(h => h.object === f.userData.front);
        });
        const accel = Math.hypot(targetMouse.x - currentMouse.x, targetMouse.y - currentMouse.y);
        if (magnetized && accel > 2) magnetized = null;
        folders.forEach(f => {
          const ud = f.userData;
          const to = cursor3D.clone().sub(f.position);
          const d = to.length();
          if (magnetized === f && now - ud.magnetStart > 2000) magnetized = null;
          if (d < ud.innerR && accel > 3 && !ud.spin) {
            ud.spin = true;
            ud.spinElapsed = 0;
          }
          if (ud.spin) {
            ud.spinElapsed += 0.1;
            f.rotation.y = (ud.spinElapsed / ud.spinDuration) * Math.PI * 2;
            if (ud.spinElapsed >= ud.spinDuration) {
              ud.spin = false;
              f.rotation.y = 0;
            }
            return;
          }
          if ((magnetized === null || magnetized === f) && d < ud.innerR) {
            magnetized = f;
            ud.magnetStart = now;
            const repel = new THREE.Vector3();
            folders.forEach(o => {
              if (o !== f) {
                const dv = f.position.clone().sub(o.position);
                const distSq = dv.lengthSq();
                if (distSq < 16) repel.add(dv.normalize().multiplyScalar(0.04));
              }
            });
            f.position.add(repel);
            const offset = new THREE.Vector3(0, -0.9, 0);
            f.position.lerp(cursor3D.clone().add(offset), 0.045);
            ud.hoverPhase += 0.1;
            ud.front.rotation.x += (THREE.MathUtils.degToRad(15) - ud.front.rotation.x) * 0.1;
            const breeze = accel * 0.25;
            f.rotation.y += (Math.sin(ud.hoverPhase) * breeze - f.rotation.y) * 0.2;
            f.rotation.z += (Math.cos(ud.hoverPhase) * breeze * 0.5 - f.rotation.z) * 0.2;
            return;
          }
          if (ud.returning) {
            const t = Math.min((now - ud.returnStart) / ud.returnDuration, 1);
            f.position.lerpVectors(ud.returnFrom, ud.returnTo, orbitEase(t));
            f.scale.lerpVectors(ud.scaleReturnFrom, ud.scaleReturnTo, orbitEase(t));
            if (t >= 1) {
              ud.returning = false;
            }
            return;
          }
          f.rotation.y += (0 - f.rotation.y) * 0.2;
          f.rotation.z += (0 - f.rotation.z) * 0.2;
          if (ud.hovered) ud.front.rotation.x += (THREE.MathUtils.degToRad(15) - ud.front.rotation.x) * 0.1;
          else ud.front.rotation.x += (0 - ud.front.rotation.x) * 0.1;
          ud.curvePhase += 0.01;
          const repel2 = new THREE.Vector3();
          folders.forEach(o => {
            if (o !== f) {
              const dv = f.position.clone().sub(o.position);
              const sq = dv.lengthSq();
              if (sq < 100) repel2.add(dv.normalize().multiplyScalar(0.08 / sq));
            }
          });
          const curveVec = new THREE.Vector3(
            Math.sin(ud.curvePhase),
            Math.sin(ud.curvePhase * 0.9),
            Math.cos(ud.curvePhase * 0.8)
          ).multiplyScalar(ud.curveScale);
          const cf = new THREE.Vector3();
          const magR = 5;
          if (d < magR && d > ud.innerR) cf.add(to.normalize().multiplyScalar((magR - d) / magR * 0.02));
          f.position.add(
            ud.dir.clone().multiplyScalar(ud.speed)
              .add(curveVec)
              .add(repel2)
              .add(cf)
          );
          ['x', 'y'].forEach(a => {
            if (f.position[a] > 5 || f.position[a] < -5) ud.dir[a] *= -1;
          });
          f.position.z = Math.max(-0.4, Math.min(0.4, f.position.z));
          ud.orbitAnchor.copy(f.position);
        });
        updateLabels(-1);
        networkCtx.clearRect(0, 0, networkCanvas.width, networkCanvas.height);
      }

      dirLight.position.x += (targetMouse.x * 10 - dirLight.position.x) * 0.1;
      dirLight.position.y += (targetMouse.y * 10 - dirLight.position.y) * 0.1;
      const a2 = Math.hypot(targetMouse.x - currentMouse.x, targetMouse.y - currentMouse.y);
      currentMouse.x += (targetMouse.x - currentMouse.x) * 0.02 * a2;
      currentMouse.y += (targetMouse.y - currentMouse.y) * 0.02 * a2;
      const cameraFactorX = mode === 'align' ? 1.6 : 3;
      const cameraFactorY = mode === 'align' ? 1.4 : 3;
      camera.position.set(currentMouse.x * cameraFactorX, currentMouse.y * cameraFactorY, 16);
      camera.lookAt(0, 0, 0);

      bgRenderer.render(scene, camera);
      folders.forEach(f => f.visible = true);
      fgRenderer.render(scene, camera);
    }
    animate();

    window.addEventListener('message', e => {
      if (!e.data) return;
      let pendingReinit = false;
      if (e.data.showcase) {
        setPortfolioShowcase(e.data.showcase);
        pendingReinit = true;
      }
      if (Array.isArray(e.data.folders)) {
        initFolders(e.data.folders);
        pendingReinit = false;
      } else if (pendingReinit) {
        initFolders();
      }
      if (e.data.theme && e.data.theme.accent) {
        accentColor = e.data.theme.accent;
        networkAccent = accentColor;
        labelsContainer.style.setProperty('--accent-color', accentColor);
        if (showcasePanel) {
          showcasePanel.style.setProperty('--accent-color', accentColor);
        }
        if (gifPreview) {
          gifPreview.style.setProperty('--accent-color', accentColor);
        }
      }
    });

    initFolders();
    parent.postMessage({ requestFolders: true }, '*');
  </script>
</body>
</html>
