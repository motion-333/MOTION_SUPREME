<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Folder Orbit</title>
  <style>
    :root {
      --accent: #1449ff;
    }
    @font-face {
      font-family: 'Ferrite';
      src: url('/static/FERRITEDISPLAYVF.ttf') format('truetype');
      font-weight: 100 900;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      cursor: default;
    }
    #sceneWrap {
      position: fixed;
      inset: 0;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #bgCanvas { z-index: 0; }
    #fgCanvas { z-index: 1; pointer-events: none; }
    #networkCanvas {
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #networkCanvas.visible { opacity: 1; }
    #labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      font-family: 'Ferrite', sans-serif;
      color: var(--accent);
    }
    .label {
      position: absolute;
      transform: translate(-50%, 0);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      font-variation-settings: 'wght' 780;
      text-shadow: 0 0 3px rgba(20,73,255,0.16), 0 0 7px rgba(255,255,255,0.65);
      transition: opacity 0.3s ease;
      opacity: 0.9;
      white-space: nowrap;
      font-size: clamp(0.5rem, 0.9vw, 0.95rem);
    }
    .label.selected {
      opacity: 1;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="sceneWrap">
    <canvas id="bgCanvas"></canvas>
    <canvas id="fgCanvas"></canvas>
    <canvas id="networkCanvas"></canvas>
    <div id="labels"></div>
  </div>

  <script src="https://unpkg.com/three@0.148.0/build/three.min.js"></script>
  <script>
    const DEFAULT_FOLDERS = ['Photo', 'Video', 'Soc. Med.', 'Art Dir.', 'Web', 'Design'];
    const BADGE_TEXTS = ['PHOTO', 'VIDEO', 'SOC. MED.', 'ART DIR.', 'WEB', 'DESIGN'];

    const sceneWrap = document.getElementById('sceneWrap');
    const bgCanvas = document.getElementById('bgCanvas');
    const fgCanvas = document.getElementById('fgCanvas');
    const networkCanvas = document.getElementById('networkCanvas');
    const labelsContainer = document.getElementById('labels');

    const bgRenderer = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias: true, alpha: true });
    bgRenderer.setClearColor(0x000000, 0);
    const fgRenderer = new THREE.WebGLRenderer({ canvas: fgCanvas, antialias: true, alpha: true });
    fgRenderer.setClearColor(0, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 16;

    const ambient = new THREE.AmbientLight(0xffffff, 0.88);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.12);
    dirLight.position.set(0, 0.5, 6);
    scene.add(dirLight);
    const rimLight = new THREE.DirectionalLight(0x8ecbff, 0.12);
    rimLight.position.set(-6, 3.5, -6);
    scene.add(rimLight);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const cursor3D = new THREE.Vector3();
    const targetMouse = { x: 0, y: 0 };
    const currentMouse = { x: 0, y: 0 };
    let magnetized = null;

    const folders = [];
    const labels = [];

    let mode = 'orbit';
    let selectedIndex = -1;
    let targetSelection = 0;
    let currentSelection = 0;
    let alignActivatedAt = 0;
    let alignIntroDone = false;
    const alignDuration = 1000;
    const baseAlignSpacing = 5.0;
    const alignTopBaseline = -3.35;
    const topAnchorHeight = 1.95;
    const selectedScale = 1.58;
    const neighbourScale = 1.22;
    const farScale = 1.02;
    const baseAlignTilt = THREE.MathUtils.degToRad(-8);
    const selectionCooldown = 380;
    let lastSelectionChange = 0;

    const alignEase = t => t < 0.5 ? 2 * t * t : (-1 + (4 - 2 * t) * t);
    const orbitEase = alignEase;

    const networkCtx = networkCanvas.getContext('2d');
    const networkPoints = [];
    const NETWORK_COUNT = 17;
    let accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent')?.trim() || '#1449ff';

    function setAccent(color) {
      if (!color) return;
      accentColor = color;
      document.documentElement.style.setProperty('--accent', accentColor);
      updateLabelStyles();
      folders.forEach(f => refreshBadge(f.userData.badge));
    }

    let edgeHover = { dir: 0, strength: 0, accumulator: 0 };

    function computeAlignSpacing() {
      const len = folders.length || DEFAULT_FOLDERS.length || 1;
      return baseAlignSpacing * (DEFAULT_FOLDERS.length / len);
    }

    function hexToRgb(hex) {
      const match = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!match) return null;
      return {
        r: parseInt(match[1], 16),
        g: parseInt(match[2], 16),
        b: parseInt(match[3], 16)
      };
    }

    function rgbaString(hex, alpha) {
      const rgb = hexToRgb(hex);
      if (!rgb) return `rgba(0,0,0,${alpha})`;
      return `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    }

    function updateLabelStyles() {
      const softGlow = rgbaString(accentColor, 0.25);
      labels.forEach(lbl => {
        lbl.style.color = accentColor;
        lbl.style.textShadow = `0 0 3px ${softGlow}, 0 0 7px rgba(255,255,255,0.55)`;
      });
    }

    function createBadge(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.font = "700 150px 'Ferrite', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = accentColor;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 12);
      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 4;
      texture.needsUpdate = true;
      const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
      material.depthTest = false;
      material.depthWrite = false;
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 0.7), material);
      plane.position.set(0, 1.6, 0.031);
      plane.renderOrder = 10;
      return { text, canvas, ctx, texture, material, mesh: plane };
    }

    function refreshBadge(badge) {
      if (!badge) return;
      const { ctx, canvas, texture, text } = badge;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = accentColor;
      ctx.font = "700 150px 'Ferrite', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 12);
      texture.needsUpdate = true;
    }

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      bgRenderer.setSize(w, h);
      fgRenderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      networkCanvas.width = w;
      networkCanvas.height = h;
    }
    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('mousemove', e => {
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = -(e.clientY / window.innerHeight - 0.5) * 2;
      targetMouse.x = nx;
      targetMouse.y = ny;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const d = -raycaster.ray.origin.z / raycaster.ray.direction.z;
      cursor3D.copy(raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(d)));

      if (mode === 'align') {
        const zone = window.innerWidth * 0.1;
        if (e.clientX < zone) {
          edgeHover.dir = -1;
          edgeHover.strength = Math.min(1, (zone - e.clientX) / zone) * 0.75;
        } else if (e.clientX > window.innerWidth - zone) {
          edgeHover.dir = 1;
          edgeHover.strength = Math.min(1, (e.clientX - (window.innerWidth - zone)) / zone) * 0.75;
        } else {
          edgeHover.dir = 0;
          edgeHover.strength = 0;
          edgeHover.accumulator = Math.max(0, edgeHover.accumulator - 0.025);
        }
      }
    });

    const ease = t => t < 0.5 ? 2 * t * t : (-1 + (4 - 2 * t) * t);

    function createFolder(name, badgeText) {
      const g = new THREE.Group();
      const frontMat = new THREE.MeshStandardMaterial({ color: 0x89d8fd, roughness: 0.4, metalness: 0.2 });
      const backMat  = new THREE.MeshStandardMaterial({ color: 0x5bbde9, roughness: 0.45, metalness: 0.15 });
      const w = 2.5, h = 1.8, r = 0.15;
      const shape = new THREE.Shape();
      shape.moveTo(-w/2 + r, -h/2)
           .lineTo(w/2 - r, -h/2)
           .quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r)
           .lineTo(w/2, h/2 - r)
           .quadraticCurveTo(w/2, h/2, w/2 - r, h/2)
           .lineTo(-w/2 + r, h/2)
           .quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r)
           .lineTo(-w/2, -h/2 + r)
           .quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);
      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.03,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2
      });
      const front = new THREE.Mesh(geom, frontMat);
      front.geometry.translate(0, 0.9, 0);
      front.position.z = 0.015;
      front.castShadow = true;
      g.add(front);
      const back = new THREE.Mesh(geom.clone(), backMat);
      back.scale.y = 1.07;
      back.position.set(0, 0.05, -0.015);
      back.receiveShadow = true;
      g.add(back);
      const baseScale = 1.05;
      g.scale.set(baseScale, baseScale, baseScale);

      const lipShape = new THREE.Shape();
      lipShape.moveTo(-1.25, 0)
              .quadraticCurveTo(-1.25, 0.2, -1.1, 0.2)
              .lineTo(-0.6, 0.2)
              .quadraticCurveTo(-0.45, 0.2, -0.3, 0)
              .lineTo(-0.3, -0.3)
              .quadraticCurveTo(-0.32, -0.43, -0.6, -0.43)
              .lineTo(-1.22, -0.42)
              .quadraticCurveTo(-1.28, -0.38, -1.24, -0.3)
              .lineTo(-1.25, 0);
      const lip = new THREE.Mesh(new THREE.ExtrudeGeometry(lipShape, {
        depth: 0.03,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2
      }), backMat);
      lip.position.set(0, 1.9, -0.015);
      lip.receiveShadow = true;
      g.add(lip);

      const badge = createBadge(badgeText || name.toUpperCase());
      g.add(badge.mesh);

      const dir = new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 0).normalize();
      g.userData = {
        name,
        front,
        dir,
        speed: 0.002 + Math.random() * 0.001,
        curvePhase: Math.random() * Math.PI * 2,
        curveScale: 0.005 + Math.random() * 0.003,
        focused: false,
        clickStart: 0,
        startPos: new THREE.Vector3(),
        targetPos: new THREE.Vector3(),
        duration: 1000,
        innerR: 1.2,
        hoverPhase: 0,
        returning: false,
        returnStart: 0,
        returnFrom: new THREE.Vector3(),
        returnTo: new THREE.Vector3(),
        returnDuration: 1000,
        spin: false,
        spinElapsed: 0,
        spinDuration: 1,
        magnetStart: 0,
        startScale: new THREE.Vector3(),
        targetScale: new THREE.Vector3(),
        scaleReturnFrom: new THREE.Vector3(),
        scaleReturnTo: new THREE.Vector3(),
        alignDelay: 0,
        alignFrom: null,
        alignFromScale: null,
        alignFromRot: null,
        orbitAnchor: new THREE.Vector3(),
        lastAlignPos: new THREE.Vector3(),
        twist: { y: 0, z: 0 },
        baseScale,
        badge,
        wrapUntil: 0
      };
      return g;
    }

    const modFloat = (n, m) => ((n % m) + m) % m;

    function wrapIndex(idx) {
      const len = folders.length || 1;
      return ((idx % len) + len) % len;
    }

    function setTargetSelection(index, directionHint = 0, force = false) {
      if (!folders.length) return;
      const len = folders.length;
      const normalizedTarget = wrapIndex(index);
      const currentWrapped = modFloat(currentSelection, len);
      const nowTime = performance.now();
      if (!force && nowTime - lastSelectionChange < selectionCooldown) return;
      lastSelectionChange = nowTime;
      let delta = normalizedTarget - currentWrapped;
      if (directionHint > 0 && delta < 0) delta += len;
      else if (directionHint < 0 && delta > 0) delta -= len;
      else {
        if (delta > len / 2) delta -= len;
        if (delta < -len / 2) delta += len;
      }
      targetSelection = currentSelection + delta;
      selectedIndex = normalizedTarget;
      prepareAlignTargets(false);
      rebuildNetwork();
    }

    function circularOffset(index, center, length) {
      if (!length) return 0;
      let diff = index - center;
      diff = modFloat(diff + length / 2, length) - length / 2;
      return diff;
    }

    function rebuildNetwork() {
      networkPoints.length = 0;
      for (let i = 0; i < NETWORK_COUNT; i++) {
        networkPoints.push({
          x: (0.18 + Math.random() * 0.64) * networkCanvas.width,
          y: (0.48 + Math.random() * 0.18) * networkCanvas.height,
          vx: (Math.random() - 0.5) * 0.12,
          vy: (Math.random() - 0.5) * 0.12
        });
      }
    }

    function drawNetwork(dt) {
      networkCtx.clearRect(0, 0, networkCanvas.width, networkCanvas.height);
      if (mode !== 'align') return;
      const width = networkCanvas.width;
      const height = networkCanvas.height;
      const minX = width * 0.12;
      const maxX = width * 0.88;
      const minY = height * 0.48;
      const maxY = height * 0.7;
      networkPoints.forEach(p => {
        p.x += p.vx * dt * 0.06;
        p.y += p.vy * dt * 0.06;
        if (p.x < minX || p.x > maxX) {
          p.vx *= -1;
          p.x = THREE.MathUtils.clamp(p.x, minX, maxX);
        }
        if (p.y < minY || p.y > maxY) {
          p.vy *= -1;
          p.y = THREE.MathUtils.clamp(p.y, minY, maxY);
        }
      });
      networkCtx.strokeStyle = accentColor;
      networkCtx.lineWidth = 1;
      networkCtx.globalAlpha = 0.28;
      for (let i = 0; i < networkPoints.length; i++) {
        const point = networkPoints[i];
        for (let j = i + 1; j < networkPoints.length; j++) {
          const other = networkPoints[j];
          networkCtx.beginPath();
          networkCtx.moveTo(point.x, point.y);
          networkCtx.lineTo(other.x, other.y);
          networkCtx.stroke();
        }
      }
      networkCtx.globalAlpha = 1;
      networkPoints.forEach(p => {
        networkCtx.beginPath();
        networkCtx.fillStyle = accentColor;
        networkCtx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
        networkCtx.fill();
      });
    }

    function initFolders(listOverride) {
      const list = (Array.isArray(listOverride) && listOverride.length ? listOverride : DEFAULT_FOLDERS).slice();
      FOLDER_NAMES = list;
      folders.forEach(f => scene.remove(f));
      folders.length = 0;
      labelsContainer.innerHTML = '';
      labels.length = 0;
      list.forEach((name, idx) => {
        const badgeLabel = BADGE_TEXTS[idx % BADGE_TEXTS.length];
        const f = createFolder(name, badgeLabel);
        scene.add(f);
        folders.push(f);
        const lbl = document.createElement('div');
        lbl.className = 'label';
        lbl.textContent = name.toUpperCase();
        labelsContainer.appendChild(lbl);
        labels.push(lbl);
      });
      updateLabelStyles();
      mode = 'orbit';
      selectedIndex = -1;
      currentSelection = 0;
      targetSelection = 0;
      magnetized = null;
      startTime = performance.now();
      rebuildNetwork();
      networkCanvas.classList.remove('visible');
    }

    let startTime = performance.now();
    const introDur = 3000;
    const scatterDur = 2000;

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(folders.map(f => f.userData.front));
      if (!hits.length) return;
      const f = hits[0].object.parent;
      const idx = folders.indexOf(f);
      if (idx === -1) return;
      if (mode === 'orbit') {
        selectedIndex = idx;
        currentSelection = idx;
        targetSelection = idx;
        enterAlign();
      } else {
        if (idx === selectedIndex) {
          exitAlign();
        } else {
        setTargetSelection(idx, 0, true);
        }
      }
    });

    function enterAlign() {
      mode = 'align';
      alignActivatedAt = performance.now();
      lastSelectionChange = alignActivatedAt;
      alignIntroDone = false;
      folders.forEach(f => {
        const ud = f.userData;
        ud.orbitAnchor.copy(f.position);
        ud.lastAlignPos.copy(f.position);
      });
      prepareAlignTargets(true);
      rebuildNetwork();
      networkCanvas.classList.add('visible');
    }

    function prepareAlignTargets(stagger = false) {
      alignActivatedAt = performance.now();
      const len = folders.length || 1;
      folders.forEach((f, i) => {
        const ud = f.userData;
        f.visible = true;
        ud.wrapUntil = 0;
        const delayFactor = stagger ? Math.abs(circularOffset(i, selectedIndex, len)) : 0;
        ud.alignDelay = delayFactor * 140;
        ud.alignFrom = f.position.clone();
        ud.alignFromScale = f.scale.clone();
        ud.alignFromRot = f.rotation.clone();
        ud.lastAlignPos.copy(f.position);
      });
    }

    function exitAlign() {
      mode = 'orbit';
      networkCanvas.classList.remove('visible');
      edgeHover = { dir: 0, strength: 0, accumulator: 0 };
      folders.forEach(f => {
        const ud = f.userData;
        f.visible = true;
        ud.wrapUntil = 0;
        ud.returning = true;
        ud.returnStart = performance.now();
        ud.returnFrom.copy(f.position);
        ud.returnTo.copy(ud.orbitAnchor);
        ud.scaleReturnFrom.copy(f.scale);
        const base = ud.baseScale || 1.05;
        ud.scaleReturnTo.set(base, base, base);
      });
      selectedIndex = -1;
      targetSelection = 0;
      currentSelection = 0;
    }

    function updateLabels(selectedRounded) {
      const len = folders.length;
      const normalized = len > 0 && selectedRounded >= 0 ? wrapIndex(selectedRounded) : selectedRounded;
      labels.forEach((lbl, i) => {
        if (!folders[i]) return;
        const f = folders[i];
        const v = f.position.clone().project(camera);
        const x = (v.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-v.y * 0.5 + 0.5) * window.innerHeight + 12;
        lbl.style.left = `${x}px`;
        lbl.style.top = `${y}px`;
        if (normalized >= 0 && i === normalized) lbl.classList.add('selected');
        else lbl.classList.remove('selected');
      });
    }

    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = now - lastTime;
      lastTime = now;

      if (mode === 'align') {
        magnetized = null;
        dirLight.position.lerp(new THREE.Vector3(0, -0.8, 18), 0.08);
        currentSelection += (targetSelection - currentSelection) * 0.06;
        const len = folders.length || 1;
        const selectedRounded = wrapIndex(Math.round(currentSelection));
        let allComplete = true;
        const spacing = computeAlignSpacing();
        folders.forEach((f, i) => {
          const ud = f.userData;
          const start = alignActivatedAt + ud.alignDelay;
          const t = THREE.MathUtils.clamp((now - start) / alignDuration, 0, 1);
          if (t < 1) allComplete = false;
          const tt = alignEase(t);
          const offset = modFloat(i - currentSelection + len / 2, len) - len / 2;
          const targetX = offset * spacing;
          const visualDepth = Math.abs(offset);
          const targetScaleValue = visualDepth < 0.5 ? selectedScale : (visualDepth < 1.5 ? neighbourScale : farScale);
          const targetY = alignTopBaseline - targetScaleValue * topAnchorHeight + Math.sin(now / 1400 + i) * 0.05;
          const targetZ = visualDepth * 0.12;
          const targetPos = new THREE.Vector3(targetX, targetY, targetZ);
          const targetScale = new THREE.Vector3(targetScaleValue, targetScaleValue, targetScaleValue);
          if (!ud.alignFrom) {
            ud.alignFrom = f.position.clone();
            ud.alignFromScale = f.scale.clone();
            ud.alignFromRot = f.rotation.clone();
          }
          const wrapThreshold = spacing * Math.max(1, len - 2.25);
          if (Math.abs(targetPos.x - ud.lastAlignPos.x) > wrapThreshold) {
            ud.wrapUntil = now + 160;
            ud.alignFrom = targetPos.clone();
            ud.alignFromScale = targetScale.clone();
            ud.alignFromRot = new THREE.Euler(baseAlignTilt, 0, 0);
            f.position.copy(targetPos);
            f.scale.copy(targetScale);
            f.rotation.set(baseAlignTilt, 0, 0);
            ud.lastAlignPos.copy(targetPos);
          }
          const hidden = ud.wrapUntil && now < ud.wrapUntil;
          f.visible = !hidden;
          if (hidden) {
            continue;
          }
          if (ud.wrapUntil && now >= ud.wrapUntil) {
            ud.wrapUntil = 0;
            ud.alignFrom = f.position.clone();
            ud.alignFromScale = f.scale.clone();
            ud.alignFromRot = f.rotation.clone();
          }
          const fromPos = ud.alignFrom;
          const prevPos = f.position.clone();
          f.position.copy(fromPos.clone().lerp(targetPos, tt));
          const fromScale = ud.alignFromScale || new THREE.Vector3().copy(f.scale);
          f.scale.copy(fromScale.clone().lerp(targetScale, tt));
          const dx = f.position.x - prevPos.x;
          ud.twist.y += (dx * 0.06 - ud.twist.y) * 0.2;
          ud.twist.z += (-dx * 0.04 - ud.twist.z) * 0.2;
          const fromRot = ud.alignFromRot || f.rotation.clone();
          const rotTargetX = baseAlignTilt;
          const rotX = THREE.MathUtils.lerp(fromRot.x, rotTargetX, tt);
          f.rotation.set(rotX, ud.twist.y, ud.twist.z);
          ud.front.rotation.x += (THREE.MathUtils.degToRad(9) - ud.front.rotation.x) * 0.08;
          ud.lastAlignPos.copy(targetPos);
        });
        if (!alignIntroDone && allComplete) {
          alignIntroDone = true;
        }
        if (alignIntroDone && edgeHover.dir !== 0 && folders.length > 1) {
          edgeHover.accumulator += edgeHover.strength * dt / 1550;
          if (edgeHover.accumulator >= 1) {
            const next = selectedIndex + edgeHover.dir;
            setTargetSelection(next, edgeHover.dir);
            edgeHover.accumulator = 0.25;
          }
        }
        updateLabels(selectedRounded);
        drawNetwork(dt);
      } else {
        dirLight.position.lerp(new THREE.Vector3(0, 0.2, 6.5), 0.06);
        const dtTotal = now - startTime;
        const activeFolder = null;
        if (dtTotal < introDur) {
          const a = (dtTotal / introDur) * Math.PI * 2;
          folders.forEach((f, i) => {
            const th = (i / folders.length) * Math.PI * 2 + a;
            f.position.set(Math.cos(th) * 5, Math.sin(th) * 5, 0);
          });
        } else if (dtTotal < introDur + scatterDur) {
          const p = (dtTotal - introDur) / scatterDur;
          folders.forEach((f, i) => {
            const ti = Math.max(Math.min(p * folders.length - i, 1), 0);
            const ei = orbitEase(ti);
            const th = (i / folders.length) * Math.PI * 2;
            const ctr = new THREE.Vector3(Math.cos(th) * 5, Math.sin(th) * 5, 0);
            f.position.copy(ctr.add(f.userData.dir.clone().multiplyScalar(ei * 3)));
          });
        } else {
          raycaster.setFromCamera(mouse, camera);
          const hoverHits = raycaster.intersectObjects(folders.map(f => f.userData.front));
          folders.forEach(f => {
            f.userData.hovered = hoverHits.some(h => h.object === f.userData.front);
          });
          const accel = Math.hypot(targetMouse.x - currentMouse.x, targetMouse.y - currentMouse.y);
          if (magnetized && accel > 2) magnetized = null;
          folders.forEach(f => {
            const ud = f.userData;
            const to = cursor3D.clone().sub(f.position);
            const d = to.length();
            if (magnetized === f && now - ud.magnetStart > 2000) magnetized = null;
            if (d < ud.innerR && accel > 3 && !ud.spin) {
              ud.spin = true;
              ud.spinElapsed = 0;
            }
            if (ud.spin) {
              ud.spinElapsed += 0.1;
              f.rotation.y = (ud.spinElapsed / ud.spinDuration) * Math.PI * 2;
              if (ud.spinElapsed >= ud.spinDuration) {
                ud.spin = false;
                f.rotation.y = 0;
              }
              return;
            }
            if ((magnetized === null || magnetized === f) && d < ud.innerR) {
              magnetized = f;
              ud.magnetStart = now;
              const repel = new THREE.Vector3();
              folders.forEach(o => {
                if (o !== f) {
                  const dv = f.position.clone().sub(o.position);
                  const distSq = dv.lengthSq();
                  if (distSq < 16) repel.add(dv.normalize().multiplyScalar(0.04));
                }
              });
              f.position.add(repel);
              const offset = new THREE.Vector3(0, -0.9, 0);
              f.position.lerp(cursor3D.clone().add(offset), 0.045);
              ud.hoverPhase += 0.1;
              ud.front.rotation.x += (THREE.MathUtils.degToRad(15) - ud.front.rotation.x) * 0.1;
              const breeze = accel * 0.25;
              f.rotation.y += (Math.sin(ud.hoverPhase) * breeze - f.rotation.y) * 0.2;
              f.rotation.z += (Math.cos(ud.hoverPhase) * breeze * 0.5 - f.rotation.z) * 0.2;
              return;
            }
            if (ud.returning) {
              const t = Math.min((now - ud.returnStart) / ud.returnDuration, 1);
              f.position.lerpVectors(ud.returnFrom, ud.returnTo, orbitEase(t));
              f.scale.lerpVectors(ud.scaleReturnFrom, ud.scaleReturnTo, orbitEase(t));
              if (t >= 1) {
                ud.returning = false;
              }
              return;
            }
            f.rotation.y += (0 - f.rotation.y) * 0.2;
            f.rotation.z += (0 - f.rotation.z) * 0.2;
            if (ud.hovered) ud.front.rotation.x += (THREE.MathUtils.degToRad(15) - ud.front.rotation.x) * 0.1;
            else ud.front.rotation.x += (0 - ud.front.rotation.x) * 0.1;
            ud.curvePhase += 0.01;
            const repel2 = new THREE.Vector3();
            folders.forEach(o => {
              if (o !== f) {
                const dv = f.position.clone().sub(o.position);
                const sq = dv.lengthSq();
                if (sq < 100) repel2.add(dv.normalize().multiplyScalar(0.08 / sq));
              }
            });
            const curveVec = new THREE.Vector3(
              Math.sin(ud.curvePhase),
              Math.sin(ud.curvePhase * 0.9),
              Math.cos(ud.curvePhase * 0.8)
            ).multiplyScalar(ud.curveScale);
            const cf = new THREE.Vector3();
            const magR = 5;
            if (d < magR && d > ud.innerR) cf.add(to.normalize().multiplyScalar((magR - d) / magR * 0.02));
            f.position.add(
              ud.dir.clone().multiplyScalar(ud.speed)
                .add(curveVec)
                .add(repel2)
                .add(cf)
            );
            ['x', 'y'].forEach(a => {
              if (f.position[a] > 5 || f.position[a] < -5) ud.dir[a] *= -1;
            });
            f.position.z = Math.max(-0.4, Math.min(0.4, f.position.z));
            ud.orbitAnchor.copy(f.position);
          });
        }
        updateLabels(-1);
        networkCtx.clearRect(0, 0, networkCanvas.width, networkCanvas.height);
      }

      dirLight.position.x += (targetMouse.x * 10 - dirLight.position.x) * 0.1;
      dirLight.position.y += (targetMouse.y * 10 - dirLight.position.y) * 0.1;
      const a2 = Math.hypot(targetMouse.x - currentMouse.x, targetMouse.y - currentMouse.y);
      currentMouse.x += (targetMouse.x - currentMouse.x) * 0.02 * a2;
      currentMouse.y += (targetMouse.y - currentMouse.y) * 0.02 * a2;
      camera.position.set(currentMouse.x * 3, currentMouse.y * 3, 16);
      camera.lookAt(0, 0, 0);

      bgRenderer.render(scene, camera);
      const active = null;
      folders.forEach(f => f.visible = true);
      fgRenderer.render(scene, camera);
    }
    animate();

    window.addEventListener('message', e => {
      if (e.data && Array.isArray(e.data.folders)) {
        initFolders(e.data.folders);
      }
      if (e.data && e.data.theme) {
        if (e.data.theme.accent) {
          setAccent(e.data.theme.accent);
        }
      }
    });

    initFolders();
    parent.postMessage({ requestFolders: true }, '*');
  </script>
</body>
</html>
