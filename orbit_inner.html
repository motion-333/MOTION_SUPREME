<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Folder Orbit</title>
  <style>
    @font-face {
      font-family: 'Ferrite';
      src: url('/static/FERRITEDISPLAYVF.ttf') format('truetype');
      font-weight: 100 900;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      cursor: default;
    }
    #sceneWrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #bgCanvas {
      z-index: 1;
    }
    #networkCanvas {
      z-index: 2;
      pointer-events: none;
    }
    #labels {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      font-family: 'Ferrite', sans-serif;
      color: #1449ff;
    }
    .label {
      position: absolute;
      transform: translate(-50%, -100%) scale(1);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
      transition: transform 0.4s ease, opacity 0.4s ease;
      opacity: 0.85;
      white-space: nowrap;
    }
    .label.selected {
      opacity: 1;
      letter-spacing: 0.2em;
    }
    .label.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="sceneWrap">
    <canvas id="bgCanvas"></canvas>
    <canvas id="networkCanvas"></canvas>
    <div id="labels"></div>
  </div>

  <script src="https://unpkg.com/three@0.148.0/build/three.min.js"></script>
  <script>
    const FOLDER_NAMES = ['Ads', 'Music Videos', 'Zines', 'Events', 'Graphics'];

    const sceneWrap = document.getElementById('sceneWrap');
    const bgCanvas = document.getElementById('bgCanvas');
    const networkCanvas = document.getElementById('networkCanvas');
    const labelsContainer = document.getElementById('labels');

    const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.4, 14);

    const ambient = new THREE.AmbientLight(0xffffff, 0.92);
    scene.add(ambient);
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.4);
    keyLight.position.set(3, 6, 8);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x8ecbff, 0.35);
    rimLight.position.set(-6, 4, -6);
    scene.add(rimLight);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const folders = [];
    const labels = [];

    const topY = 3.4;
    const spacing = 3.1;
    const selectedScale = 1.55;
    const baseScale = 1.05;

    let selectedIndex = -1;
    let targetSelection = 0;
    let currentSelection = 0;
    let selectionVelocity = 0;
    let selectionChangeTime = 0;

    const networkCtx = networkCanvas.getContext('2d');
    let networkPoints = [];
    let networkEdges = [];

    const clock = new THREE.Clock();

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function createFolder(name) {
      const group = new THREE.Group();

      const frontMat = new THREE.MeshStandardMaterial({ color: 0x89d8fd, roughness: 0.4, metalness: 0.18 });
      const backMat = new THREE.MeshStandardMaterial({ color: 0x5bbde9, roughness: 0.46, metalness: 0.14 });

      const w = 2.5, h = 1.8, r = 0.15;
      const bodyShape = new THREE.Shape();
      bodyShape.moveTo(-w / 2 + r, -h / 2);
      bodyShape.lineTo(w / 2 - r, -h / 2);
      bodyShape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
      bodyShape.lineTo(w / 2, h / 2 - r);
      bodyShape.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
      bodyShape.lineTo(-w / 2 + r, h / 2);
      bodyShape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
      bodyShape.lineTo(-w / 2, -h / 2 + r);
      bodyShape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);

      const geom = new THREE.ExtrudeGeometry(bodyShape, {
        depth: 0.05,
        bevelEnabled: true,
        bevelThickness: 0.04,
        bevelSize: 0.035,
        bevelSegments: 2,
      });
      geom.translate(0, 0.9, 0);

      const front = new THREE.Mesh(geom, frontMat);
      front.position.z = 0.025;
      front.castShadow = true;
      group.add(front);

      const back = new THREE.Mesh(geom.clone(), backMat);
      back.scale.y = 1.06;
      back.position.set(0, 0.08, -0.025);
      back.receiveShadow = true;
      group.add(back);

      const lipShape = new THREE.Shape();
      lipShape.moveTo(-1.25, 0)
        .quadraticCurveTo(-1.25, 0.2, -1.1, 0.2)
        .lineTo(-0.6, 0.2)
        .quadraticCurveTo(-0.45, 0.2, -0.3, 0)
        .lineTo(-0.3, -0.28)
        .quadraticCurveTo(-0.32, -0.42, -0.62, -0.42)
        .lineTo(-1.22, -0.42)
        .quadraticCurveTo(-1.28, -0.38, -1.24, -0.3)
        .lineTo(-1.25, 0);

      const lipGeom = new THREE.ExtrudeGeometry(lipShape, {
        depth: 0.05,
        bevelEnabled: true,
        bevelThickness: 0.035,
        bevelSize: 0.03,
        bevelSegments: 2,
      });
      const lip = new THREE.Mesh(lipGeom, backMat);
      lip.position.set(0, 1.85, -0.025);
      group.add(lip);

      group.scale.setScalar(baseScale);
      group.userData = {
        name,
        startPosition: new THREE.Vector3(),
        startScale: baseScale,
        delay: 0,
      };

      return group;
    }

    function initFolders() {
      FOLDER_NAMES.forEach((name, index) => {
        const folder = createFolder(name);
        folder.position.set((index - (FOLDER_NAMES.length - 1) / 2) * spacing, 0, 0);
        scene.add(folder);
        folders.push(folder);

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = name.toUpperCase();
        labelsContainer.appendChild(label);
        labels.push(label);
      });

      setSelected(0, true);
      updateLabels();
      regenerateNetwork();
    }

    function setSelected(index, immediate = false) {
      if (folders.length === 0) return;
      const clamped = Math.max(0, Math.min(index, folders.length - 1));
      const firstSelection = selectedIndex === -1;
      if (!firstSelection && clamped === selectedIndex && !immediate) return;

      selectedIndex = clamped;
      targetSelection = clamped;
      selectionChangeTime = performance.now();

      folders.forEach((folder, i) => {
        folder.userData.startPosition.copy(folder.position);
        folder.userData.startScale = folder.scale.x;
        folder.userData.delay = Math.abs(i - selectedIndex) * 140;
      });

      labels.forEach((label, i) => {
        label.classList.toggle('selected', i === selectedIndex);
      });

      regenerateNetwork();

      if (immediate) {
        currentSelection = targetSelection;
        selectionVelocity = 0;
        folders.forEach((folder, i) => {
          const offset = i - selectedIndex;
          const targetX = offset * spacing;
          const targetY = topY - Math.min(Math.abs(offset) * 0.25, 0.6);
          folder.position.set(targetX, targetY, 0);
          const scale = i === selectedIndex ? selectedScale : Math.max(baseScale - Math.abs(offset) * 0.04, 0.85);
          folder.scale.setScalar(scale);
        });
        updateLabels();
      }
    }

    function regenerateNetwork() {
      networkCanvas.width = window.innerWidth;
      networkCanvas.height = window.innerHeight;
      networkPoints = [];
      networkEdges = [];
      const width = window.innerWidth;
      const height = window.innerHeight;
      const topLimit = height * 0.38;
      const bottomLimit = height * 0.92;
      for (let i = 0; i < 17; i++) {
        const baseX = width * 0.1 + Math.random() * width * 0.8;
        const baseY = topLimit + Math.random() * (bottomLimit - topLimit);
        networkPoints.push({
          baseX,
          baseY,
          x: baseX,
          y: baseY,
          angle: Math.random() * Math.PI * 2,
          amplitude: 14 + Math.random() * 22,
          speed: 0.35 + Math.random() * 0.55,
        });
      }
      for (let i = 0; i < networkPoints.length; i++) {
        const neighbors = networkPoints
          .map((p, idx) => ({ idx, dist: Math.hypot(p.baseX - networkPoints[i].baseX, p.baseY - networkPoints[i].baseY) }))
          .filter(n => n.idx !== i)
          .sort((a, b) => a.dist - b.dist)
          .slice(0, 3);
        neighbors.forEach(n => {
          if (!networkEdges.some(e => (e.a === i && e.b === n.idx) || (e.a === n.idx && e.b === i))) {
            networkEdges.push({ a: i, b: n.idx });
          }
        });
      }
    }

    let edgeDir = 0;
    let edgeTimer = 0;
    const edgeThreshold = 120;
    const hoverDelay = 550;

    window.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      if (event.clientX < edgeThreshold) edgeDir = -1;
      else if (window.innerWidth - event.clientX < edgeThreshold) edgeDir = 1;
      else edgeDir = 0;
    });

    window.addEventListener('mouseleave', () => {
      edgeDir = 0;
    });

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const intersections = raycaster.intersectObjects(folders, true);
      if (!intersections.length) return;
      let obj = intersections[0].object;
      while (obj && !folders.includes(obj)) obj = obj.parent;
      if (!obj) return;
      const index = folders.indexOf(obj);
      setSelected(index);
    });

    function updateLabels() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      labels.forEach((label, i) => {
        const folder = folders[i];
        const position = folder.position.clone().project(camera);
        if (position.z > 1) {
          label.classList.add('hidden');
          return;
        }
        label.classList.remove('hidden');
        const x = (position.x * 0.5 + 0.5) * width;
        const y = (-position.y * 0.5 + 0.5) * height;
        const scale = 0.95 + (folder.scale.x - baseScale) * 1.6;
        label.style.left = `${x}px`;
        label.style.top = `${y - 40}px`;
        label.style.transform = `translate(-50%, -100%) scale(${scale})`;
        label.style.opacity = i === selectedIndex ? '1' : '0.8';
      });
    }

    function drawNetwork(delta) {
      if (!networkCtx) return;
      networkCtx.clearRect(0, 0, networkCanvas.width, networkCanvas.height);
      if (selectedIndex === -1) return;

      networkCtx.lineWidth = 1.1;
      networkCtx.strokeStyle = 'rgba(20, 73, 255, 0.55)';
      networkCtx.fillStyle = '#1449ff';

      networkPoints.forEach(point => {
        point.angle += point.speed * delta;
        point.x = point.baseX + Math.cos(point.angle) * point.amplitude;
        point.y = point.baseY + Math.sin(point.angle * 0.8) * point.amplitude * 0.6;
      });

      networkCtx.beginPath();
      networkEdges.forEach(edge => {
        const a = networkPoints[edge.a];
        const b = networkPoints[edge.b];
        networkCtx.moveTo(a.x, a.y);
        networkCtx.lineTo(b.x, b.y);
      });
      networkCtx.stroke();

      networkPoints.forEach(point => {
        networkCtx.beginPath();
        networkCtx.arc(point.x, point.y, 3, 0, Math.PI * 2);
        networkCtx.fill();
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const now = performance.now();

      if (selectedIndex !== -1) {
        selectionVelocity += (targetSelection - currentSelection) * 0.14;
        selectionVelocity *= 0.82;
        currentSelection += selectionVelocity;
        currentSelection = Math.max(0, Math.min(folders.length - 1, currentSelection));
      }

      folders.forEach((folder, i) => {
        const ud = folder.userData;
        const dt = Math.max(0, now - selectionChangeTime - ud.delay);
        const progress = Math.min(1, dt / 600);
        const eased = easeInOut(progress);

        const targetX = (i - currentSelection) * spacing;
        const targetY = topY - Math.min(Math.abs(i - currentSelection) * 0.25, 0.6);
        const targetZ = -Math.min(Math.abs(i - currentSelection) * 0.12, 0.6);
        const targetScale = i === Math.round(currentSelection)
          ? selectedScale
          : Math.max(baseScale - Math.abs(i - currentSelection) * 0.04, 0.82);

        const lerpX = THREE.MathUtils.lerp(ud.startPosition.x, targetX, eased);
        const lerpY = THREE.MathUtils.lerp(ud.startPosition.y, targetY, eased);
        const lerpZ = THREE.MathUtils.lerp(ud.startPosition.z || 0, targetZ, eased);
        const lerpScale = THREE.MathUtils.lerp(ud.startScale, targetScale, eased);

        folder.position.x += (lerpX - folder.position.x) * 0.2;
        folder.position.y += (lerpY - folder.position.y) * 0.2;
        folder.position.z += (lerpZ - folder.position.z) * 0.18;
        const newScale = THREE.MathUtils.lerp(folder.scale.x, lerpScale, 0.25);
        folder.scale.setScalar(newScale);

        const velocityInfluence = selectionVelocity * (i - currentSelection);
        const twistTarget = Math.max(-0.45, Math.min(0.45, velocityInfluence * 1.35));
        const sway = Math.sin(now * 0.0012 + i) * 0.04;
        const bob = Math.sin(now * 0.0015 + i * 0.6) * 0.03;

        folder.rotation.y += (twistTarget - folder.rotation.y) * 0.18;
        folder.rotation.x += (sway + bob - folder.rotation.x) * 0.16;
        folder.rotation.z += ((-velocityInfluence * 0.55) - folder.rotation.z) * 0.15;
      });

      if (edgeDir !== 0 && folders.length) {
        edgeTimer += delta * 1000;
        if (edgeTimer > hoverDelay) {
          edgeTimer = 0;
          setSelected(selectedIndex + edgeDir);
        }
      } else {
        edgeTimer = 0;
      }

      keyLight.position.x += (mouse.x * 8 - keyLight.position.x) * 0.06;
      keyLight.position.y += (4 + mouse.y * 4 - keyLight.position.y) * 0.06;

      renderer.render(scene, camera);
      updateLabels();
      drawNetwork(delta);
    }

    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      networkCanvas.width = window.innerWidth;
      networkCanvas.height = window.innerHeight;
      regenerateNetwork();
      updateLabels();
    }

    window.addEventListener('resize', onResize);

    initFolders();
    animate();
  </script>
</body>
</html>
