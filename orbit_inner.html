<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Folder Orbit</title>
  <style>
    @font-face {
      font-family: 'Ferrite';
      src: url('/static/FERRITEDISPLAYVF.ttf') format('truetype');
      font-weight: 100 900;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      cursor: default;
    }
    #sceneWrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #bgCanvas {
      z-index: 1;
    }
    #networkCanvas {
      z-index: 2;
      pointer-events: none;
    }
    #labels {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      font-family: 'Ferrite', sans-serif;
      color: #1449ff;
    }
    .label {
      position: absolute;
      transform: translate(-50%, 0) scale(1);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
      transition: opacity 0.4s ease, transform 0.45s ease;
      opacity: 0.9;
      white-space: nowrap;
    }
    .label.selected {
      opacity: 1;
      letter-spacing: 0.22em;
    }
    .label.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="sceneWrap">
    <canvas id="bgCanvas"></canvas>
    <canvas id="networkCanvas"></canvas>
    <div id="labels"></div>
  </div>

  <script src="https://unpkg.com/three@0.148.0/build/three.min.js"></script>
  <script>
    const FOLDER_NAMES = ['Ads', 'Music Videos', 'Zines', 'Events', 'Graphics'];

    const bgCanvas = document.getElementById('bgCanvas');
    const networkCanvas = document.getElementById('networkCanvas');
    const labelsContainer = document.getElementById('labels');

    const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2.2, 18);

    const ambient = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambient);
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.34);
    keyLight.position.set(3.5, 5.8, 8);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x8ecbff, 0.26);
    rimLight.position.set(-6, 3.5, -6);
    scene.add(rimLight);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const targetMouse = { x: 0, y: 0 };
    const currentMouse = { x: 0, y: 0 };
    const cursor3D = new THREE.Vector3();

    const folders = [];
    const labels = [];

    const topY = 3.4;
    const spacing = 3.1;
    const selectedScale = 1.45;
    const baseScale = 0.9;

    let aligned = false;
    let alignmentGoal = 0;
    let selectedIndex = -1;
    let targetSelection = 0;
    let currentSelection = 0;
    let selectionVelocity = 0;

    let edgeTarget = 0;
    let edgeState = 0;

    let magnetized = null;

    const networkCtx = networkCanvas.getContext('2d');
    const networkCharacters = ['M', 'O', 'T', 'I', 'O', 'N', '3', '3', '3'];
    let networkPoints = [];
    let networkEdges = [];

    const clock = new THREE.Clock();

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    function createFolder(name, index) {
      const group = new THREE.Group();

      const frontMat = new THREE.MeshStandardMaterial({ color: 0x89d8fd, roughness: 0.4, metalness: 0.2 });
      const backMat = new THREE.MeshStandardMaterial({ color: 0x5bbde9, roughness: 0.45, metalness: 0.15 });

      const w = 2.5, h = 1.8, r = 0.15;
      const bodyShape = new THREE.Shape();
      bodyShape.moveTo(-w / 2 + r, -h / 2);
      bodyShape.lineTo(w / 2 - r, -h / 2);
      bodyShape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
      bodyShape.lineTo(w / 2, h / 2 - r);
      bodyShape.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
      bodyShape.lineTo(-w / 2 + r, h / 2);
      bodyShape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
      bodyShape.lineTo(-w / 2, -h / 2 + r);
      bodyShape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);

      const geom = new THREE.ExtrudeGeometry(bodyShape, {
        depth: 0.03,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2,
      });

      const front = new THREE.Mesh(geom, frontMat);
      front.geometry.translate(0, 0.9, 0);
      front.position.z = 0.015;
      front.castShadow = true;
      group.add(front);

      const back = new THREE.Mesh(geom.clone(), backMat);
      back.scale.y = 1.07;
      back.position.set(0, 0.05, -0.015);
      back.receiveShadow = true;
      group.add(back);

      const lipShape = new THREE.Shape();
      lipShape.moveTo(-1.25, 0)
        .quadraticCurveTo(-1.25, 0.2, -1.1, 0.2)
        .lineTo(-0.6, 0.2)
        .quadraticCurveTo(-0.45, 0.2, -0.3, 0)
        .lineTo(-0.3, -0.3)
        .quadraticCurveTo(-0.32, -0.43, -0.6, -0.43)
        .lineTo(-1.22, -0.42)
        .quadraticCurveTo(-1.28, -0.38, -1.24, -0.3)
        .lineTo(-1.25, 0);

      const lip = new THREE.Mesh(new THREE.ExtrudeGeometry(lipShape, {
        depth: 0.03,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2,
      }), backMat);
      lip.position.set(0, 1.9, -0.015);
      lip.receiveShadow = true;
      group.add(lip);

      group.scale.setScalar(baseScale);

      const orbitAngle = (index / FOLDER_NAMES.length) * Math.PI * 2;
      const initialRadius = 5.4 + Math.random() * 2.2;
      const initialHeight = Math.sin(orbitAngle * 1.4) * 2.4;

      group.position.set(
        Math.cos(orbitAngle) * initialRadius,
        initialHeight,
        Math.sin(orbitAngle) * 1.6
      );

      const dir = new THREE.Vector3(randomRange(-1, 1), randomRange(-0.6, 0.8), randomRange(-0.3, 0.3)).normalize();

      group.userData = {
        name,
        front,
        freePosition: group.position.clone(),
        freeRotation: new THREE.Euler(0, 0, 0),
        freeScale: baseScale,
        dir,
        speed: 0.006 + Math.random() * 0.0025,
        curvePhase: Math.random() * Math.PI * 2,
        curveScale: 0.12 + Math.random() * 0.05,
        hoverPhase: Math.random() * Math.PI * 2,
        innerR: 1.35 + Math.random() * 0.35,
        hoverOffset: new THREE.Vector3(0, -0.9, 0),
        alignAlpha: 0,
        alignFrom: 0,
        alignDelay: 0,
        alignClock: 0,
        alignDuration: 0.8,
      };

      return group;
    }

    function initFolders() {
      FOLDER_NAMES.forEach((name, index) => {
        const folder = createFolder(name, index);
        scene.add(folder);
        folders.push(folder);

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = name.toUpperCase();
        labelsContainer.appendChild(label);
        labels.push(label);
      });
    }

    function regenerateNetwork() {
      networkCanvas.width = window.innerWidth;
      networkCanvas.height = window.innerHeight;
      networkPoints = [];
      networkEdges = [];
      const width = window.innerWidth;
      const height = window.innerHeight;
      const topLimit = height * 0.38;
      const bottomLimit = height * 0.9;
      const usableWidth = width * 0.76;
      const leftOffset = width * 0.12;

      networkCharacters.forEach(char => {
        const baseX = leftOffset + Math.random() * usableWidth;
        const baseY = topLimit + Math.random() * (bottomLimit - topLimit);
        networkPoints.push({
          char,
          baseX,
          baseY,
          x: baseX,
          y: baseY,
          angle: Math.random() * Math.PI * 2,
          amplitude: 10 + Math.random() * 18,
          speed: 0.25 + Math.random() * 0.35,
          pulse: Math.random() * Math.PI * 2,
        });
      });

      const edgeSet = new Set();
      const maxNeighbors = 3;
      for (let i = 0; i < networkPoints.length; i++) {
        const distances = [];
        for (let j = 0; j < networkPoints.length; j++) {
          if (i === j) continue;
          const dx = networkPoints[j].baseX - networkPoints[i].baseX;
          const dy = networkPoints[j].baseY - networkPoints[i].baseY;
          distances.push({ j, d: Math.hypot(dx, dy) });
        }
        distances.sort((a, b) => a.d - b.d);
        for (let k = 0; k < Math.min(maxNeighbors, distances.length); k++) {
          const idx = distances[k].j;
          const key = i < idx ? `${i}-${idx}` : `${idx}-${i}`;
          if (!edgeSet.has(key)) {
            edgeSet.add(key);
            networkEdges.push({ a: i, b: idx });
          }
        }
      }
    }

    function drawNetwork(delta, strength) {
      networkCtx.clearRect(0, 0, networkCanvas.width, networkCanvas.height);
      if (strength < 0.2) return;

      const now = performance.now();
      networkPoints.forEach(point => {
        point.angle += point.speed * delta;
        point.pulse += delta * 1.2;
        point.x = point.baseX + Math.cos(point.angle) * point.amplitude;
        point.y = point.baseY + Math.sin(point.angle * 0.85) * point.amplitude * 0.55;
      });

      networkCtx.lineWidth = 0.6 + strength * 0.5;
      networkCtx.strokeStyle = `rgba(20, 73, 255, ${0.24 + strength * 0.28})`;
      networkCtx.beginPath();
      networkEdges.forEach(edge => {
        const a = networkPoints[edge.a];
        const b = networkPoints[edge.b];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 12) return;
        const gap = 5;
        const offsetX = (dx / dist) * gap;
        const offsetY = (dy / dist) * gap;
        networkCtx.moveTo(a.x + offsetX, a.y + offsetY);
        networkCtx.lineTo(b.x - offsetX, b.y - offsetY);
      });
      networkCtx.stroke();

      networkCtx.fillStyle = '#1449ff';
      networkCtx.font = `${18 + strength * 8}px Ferrite, sans-serif`;
      networkCtx.textAlign = 'center';
      networkCtx.textBaseline = 'middle';
      networkPoints.forEach(point => {
        const wobble = Math.sin(point.pulse + now * 0.0006) * 2.5;
        networkCtx.save();
        networkCtx.translate(point.x, point.y);
        networkCtx.rotate(Math.sin(point.pulse * 0.6) * 0.06);
        networkCtx.fillText(point.char, wobble, 0);
        networkCtx.restore();
      });
    }

    function scheduleAlignment(index, aligning, immediate = false) {
      alignmentGoal = aligning ? 1 : 0;
      const baseDelay = aligning ? 0.14 : 0.12;
      folders.forEach((folder, i) => {
        const data = folder.userData;
        const falloff = index >= 0 ? Math.abs(i - index) : Math.abs(i - Math.floor(folders.length / 2));
        data.alignFrom = immediate ? alignmentGoal : data.alignAlpha;
        data.alignDelay = immediate ? 0 : falloff * baseDelay;
        data.alignClock = 0;
        data.alignDuration = aligning ? 0.85 : 0.8 + falloff * 0.05;
        if (immediate) {
          data.alignAlpha = alignmentGoal;
        }
      });
      if (aligning) {
        regenerateNetwork();
      } else {
        magnetized = null;
      }
    }

    function enterAligned(index, immediate = false) {
      aligned = true;
      selectedIndex = index;
      targetSelection = index;
      currentSelection = index;
      selectionVelocity = 0;
      scheduleAlignment(index, true, immediate);
      updateLabelSelection();
    }

    function exitAligned() {
      aligned = false;
      scheduleAlignment(selectedIndex, false);
      selectedIndex = -1;
      updateLabelSelection();
    }

    function setSelected(index) {
      if (!aligned) {
        enterAligned(index);
        return;
      }
      if (selectedIndex === index) {
        exitAligned();
        return;
      }
      selectedIndex = index;
      targetSelection = index;
      updateLabelSelection();
      regenerateNetwork();
    }

    function updateLabelSelection() {
      labels.forEach((label, i) => {
        label.classList.toggle('selected', aligned && i === selectedIndex);
      });
    }

    window.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      const normalizedX = (event.clientX / window.innerWidth - 0.5) * 2;
      const normalizedY = -(event.clientY / window.innerHeight - 0.5) * 2;
      targetMouse.x = normalizedX;
      targetMouse.y = normalizedY;

      raycaster.setFromCamera(mouse, camera);
      const distance = -raycaster.ray.origin.z / raycaster.ray.direction.z;
      cursor3D.copy(raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(distance)));

      if (aligned) {
        const edgeZone = window.innerWidth * 0.1;
        const leftRatio = THREE.MathUtils.clamp(1 - event.clientX / edgeZone, 0, 1);
        const rightRatio = THREE.MathUtils.clamp((event.clientX - (window.innerWidth - edgeZone)) / edgeZone, 0, 1);
        if (leftRatio > 0.001) {
          edgeTarget = -leftRatio;
        } else if (rightRatio > 0.001) {
          edgeTarget = rightRatio;
        } else {
          edgeTarget = 0;
        }
      } else {
        edgeTarget = 0;
      }
    });

    window.addEventListener('mouseleave', () => {
      edgeTarget = 0;
    });

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const intersections = raycaster.intersectObjects(folders.map(f => f.userData.front));
      if (!intersections.length) return;
      const folder = intersections[0].object.parent;
      const index = folders.indexOf(folder);
      if (index === -1) return;
      setSelected(index);
    });

    function updateLabels() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      labels.forEach((label, i) => {
        const folder = folders[i];
        const position = folder.position.clone().project(camera);
        if (position.z > 1) {
          label.classList.add('hidden');
          return;
        }
        label.classList.remove('hidden');
        const x = (position.x * 0.5 + 0.5) * width;
        const y = (-position.y * 0.5 + 0.5) * height;
        const scaleInfluence = THREE.MathUtils.clamp(folder.userData.alignAlpha, 0, 1);
        const targetScale = aligned && i === Math.round(currentSelection) ? 1.15 : 1;
        const scale = THREE.MathUtils.lerp(1, targetScale, scaleInfluence);
        label.style.left = `${x}px`;
        label.style.top = `${y + 32}px`;
        label.style.transform = `translate(-50%, 0) scale(${scale})`;
        label.style.opacity = 0.72 + scaleInfluence * 0.25;
      });
    }

    function updateFreeState(folder, delta, now) {
      const data = folder.userData;
      const pos = data.freePosition;

      const toCursor = cursor3D.clone().sub(pos);
      const dist = toCursor.length();
      const mouseSpeed = Math.hypot(targetMouse.x - currentMouse.x, targetMouse.y - currentMouse.y);

      if (alignmentGoal < 0.5) {
        if ((magnetized === null || magnetized === folder) && dist < data.innerR) {
          magnetized = folder;
          const repel = new THREE.Vector3();
          folders.forEach(other => {
            if (other === folder) return;
            const diff = pos.clone().sub(other.userData.freePosition);
            const sq = diff.lengthSq();
            if (sq < 16) {
              repel.add(diff.normalize().multiplyScalar(0.12 / Math.max(0.2, sq)));
            }
          });
          const targetPos = cursor3D.clone().add(data.hoverOffset);
          pos.lerp(targetPos, 0.08 + mouseSpeed * 0.02);
          pos.add(repel);
          data.hoverPhase += delta * 6 + mouseSpeed * 0.35;
          data.freeRotation.x += (THREE.MathUtils.degToRad(14) - data.freeRotation.x) * 0.15;
          const twist = Math.sin(data.hoverPhase) * (0.35 + mouseSpeed * 0.15);
          data.freeRotation.y += (twist - data.freeRotation.y) * 0.18;
          data.freeRotation.z += ((Math.cos(data.hoverPhase * 0.8) * 0.22) - data.freeRotation.z) * 0.2;
          data.freeScale += ((baseScale * 1.08) - data.freeScale) * 0.2;
        } else {
          if (magnetized === folder && dist > data.innerR * 1.45) {
            magnetized = null;
          }
          data.curvePhase += delta * 1.4;
          const drift = data.dir.clone().multiplyScalar(data.speed);
          const curve = new THREE.Vector3(
            Math.sin(data.curvePhase),
            Math.sin(data.curvePhase * 0.9),
            Math.cos(data.curvePhase * 0.8)
          ).multiplyScalar(data.curveScale);
          const repel = new THREE.Vector3();
          folders.forEach(other => {
            if (other === folder) return;
            const diff = pos.clone().sub(other.userData.freePosition);
            const sq = diff.lengthSq();
            if (sq < 25) {
              repel.add(diff.normalize().multiplyScalar(0.05 / Math.max(0.25, sq)));
            }
          });
          pos.add(drift.add(curve).add(repel));
          if (Math.abs(pos.x) > 6.8) data.dir.x *= -1;
          if (pos.y > 4.5 || pos.y < -4.5) data.dir.y *= -1;
          pos.z = THREE.MathUtils.clamp(pos.z, -1.4, 1.2);
          data.freeRotation.x += (Math.sin(data.curvePhase * 0.9) * 0.18 - data.freeRotation.x) * 0.08;
          data.freeRotation.y += (Math.sin(data.curvePhase * 0.6) * 0.32 - data.freeRotation.y) * 0.08;
          data.freeRotation.z += (Math.cos(data.curvePhase * 0.75) * 0.2 - data.freeRotation.z) * 0.08;
          data.freeScale += (baseScale - data.freeScale) * 0.18;
        }
      } else {
        magnetized = null;
        data.freeRotation.x += (Math.sin(now * 0.0006 + data.curvePhase) * 0.05 - data.freeRotation.x) * 0.1;
        data.freeRotation.y += (-data.freeRotation.y) * 0.1;
        data.freeRotation.z += (-data.freeRotation.z) * 0.1;
        data.freeScale += (baseScale - data.freeScale) * 0.12;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const now = performance.now();

      currentMouse.x += (targetMouse.x - currentMouse.x) * 0.08;
      currentMouse.y += (targetMouse.y - currentMouse.y) * 0.08;
      camera.position.set(currentMouse.x * 3, currentMouse.y * 2.6 + 2.2, 18);
      camera.lookAt(0, 0.5, 0);

      edgeState += (edgeTarget - edgeState) * 0.07;

      folders.forEach((folder, i) => {
        const data = folder.userData;
        data.alignClock += delta;
        const timeInto = Math.max(0, data.alignClock - data.alignDelay);
        const ratio = data.alignDuration <= 0 ? 1 : Math.min(1, timeInto / data.alignDuration);
        const eased = easeInOut(ratio);
        const planned = THREE.MathUtils.lerp(data.alignFrom, alignmentGoal, eased);
        data.alignAlpha += (planned - data.alignAlpha) * 0.22;

        updateFreeState(folder, delta, now);
      });

      const alignStrength = folders.reduce((sum, folder) => sum + folder.userData.alignAlpha, 0) / Math.max(1, folders.length);

      if (alignmentGoal > 0.5) {
        targetSelection += edgeState * delta * 3.2;
        targetSelection = THREE.MathUtils.clamp(targetSelection, 0, folders.length - 1);
        selectionVelocity += (targetSelection - currentSelection) * (0.1 + Math.abs(edgeState) * 0.12);
        selectionVelocity *= 0.86;
        currentSelection += selectionVelocity;
        currentSelection = THREE.MathUtils.clamp(currentSelection, 0, folders.length - 1);
      } else {
        selectionVelocity *= 0.84;
        currentSelection += selectionVelocity;
        if (selectedIndex >= 0) {
          currentSelection += (selectedIndex - currentSelection) * 0.04;
        }
      }

      folders.forEach((folder, i) => {
        const data = folder.userData;
        const alignAlpha = THREE.MathUtils.clamp(data.alignAlpha, 0, 1);
        const offset = i - currentSelection;
        const alignPos = new THREE.Vector3(
          offset * spacing,
          topY - Math.min(Math.abs(offset) * 0.28, 0.7),
          -Math.min(Math.abs(offset) * 0.22, 1)
        );
        const targetPos = data.freePosition.clone().lerp(alignPos, alignAlpha);
        folder.position.lerp(targetPos, 0.38);

        const alignScale = i === Math.round(currentSelection)
          ? selectedScale
          : THREE.MathUtils.clamp(baseScale + (1 - Math.min(Math.abs(offset), 1.8)) * 0.18, baseScale * 0.85, selectedScale * 0.9);
        const targetScale = THREE.MathUtils.lerp(data.freeScale, alignScale, alignAlpha);
        const newScale = THREE.MathUtils.lerp(folder.scale.x, targetScale, 0.24 + alignAlpha * 0.18);
        folder.scale.setScalar(newScale);

        const velocityInfluence = selectionVelocity * (i - currentSelection);
        const alignRotY = THREE.MathUtils.clamp(velocityInfluence * 1.05, -0.42, 0.42);
        const alignRotX = Math.sin(now * 0.0012 + i) * 0.03 + THREE.MathUtils.clamp(-velocityInfluence * 0.3, -0.25, 0.25);
        const alignRotZ = THREE.MathUtils.clamp(-velocityInfluence * 0.62, -0.45, 0.45);

        folder.rotation.x += (THREE.MathUtils.lerp(data.freeRotation.x, alignRotX, alignAlpha) - folder.rotation.x) * 0.2;
        folder.rotation.y += (THREE.MathUtils.lerp(data.freeRotation.y, alignRotY, alignAlpha) - folder.rotation.y) * 0.2;
        folder.rotation.z += (THREE.MathUtils.lerp(data.freeRotation.z, alignRotZ, alignAlpha) - folder.rotation.z) * 0.2;
      });

      if (aligned) {
        const candidate = Math.round(currentSelection);
        const clamped = THREE.MathUtils.clamp(candidate, 0, folders.length - 1);
        if (clamped !== selectedIndex) {
          selectedIndex = clamped;
          targetSelection = THREE.MathUtils.lerp(targetSelection, selectedIndex, 0.6);
          updateLabelSelection();
          regenerateNetwork();
        }
      }

      const orbitLightPos = new THREE.Vector3(3.5, 5.8, 8);
      const alignLightPos = new THREE.Vector3(7.4, 10.5, 18);
      const lightTarget = orbitLightPos.clone().lerp(alignLightPos, alignStrength);
      keyLight.position.lerp(lightTarget, 0.06 + alignStrength * 0.08);
      keyLight.intensity = THREE.MathUtils.lerp(0.32, 0.2, alignStrength);

      renderer.render(scene, camera);
      updateLabels();
      drawNetwork(delta, alignStrength);
    }

    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      networkCanvas.width = window.innerWidth;
      networkCanvas.height = window.innerHeight;
      regenerateNetwork();
      updateLabels();
    }

    window.addEventListener('resize', onResize);

    initFolders();
    regenerateNetwork();
    animate();
  </script>
</body>
</html>
